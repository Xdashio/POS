}

function searchHistory(q) {
  state.historySearch = q;
  render();
  keep("hist-search");
}

function setHistoryFilter(f) {
  state.historyTypeFilter = f;
  render();
}

function quickReceive(productId) {
  const p = state.products.find(x => x.id === productId);
  state.receiveDraft.lines = [
    { productId, unit: "c", qty: 2, cost: p ? p.cp : 4800 }
  ];
  state.stockTab = "receive";
  render();
}

function quickAdjust(productId) {
  state.adjustmentDraft.productId = productId;
  state.stockTab = "adjust";
  render();
}

function addReceiveLine() {
  state.receiveDraft.lines.push({ productId: 0, unit: "c", qty: 1, cost: 4800 });
  render();
}

function removeReceiveLine(idx) {
  if (state.receiveDraft.lines.length > 1) {
    state.receiveDraft.lines.splice(idx, 1);
  }
  render();
}

function updateReceiveLine(idx, field, val) {
  const line = state.receiveDraft.lines[idx];
  if (!line) return;
  line[field] = val;
  if (field === "productId") {
    const p = state.products.find(x => x.id === val);
    if (p) line.cost = line.unit === "c" ? p.cp : p.b;
  }
  if (field === "unit") {
    const p = state.products.find(x => x.id === line.productId);
    if (p) line.cost = val === "c" ? p.cp : p.b;
  }
  render();
}

function updateReceiveDraft(field, val) {
  state.receiveDraft[field] = val;
  render();
  keep("rec-ref");
}

function submitReceiveGoods() {
  if (!state.receiveDraft.lines.length) {
    toast("No products in receipt");
    return false;
  }
  const ref = state.receiveDraft.invoiceRef.trim() || ("REC-" + Math.random().toString(36).slice(2, 8).toUpperCase());
  const supplier = state.receiveDraft.supplier || "Distributor";

  for (const l of state.receiveDraft.lines) {
    if (l.qty <= 0) continue;
    const p = state.products.find(x => x.id === l.productId);
    const baseDelta = toBaseUnits(p, l.unit, l.qty);
    recordStockMovement({
      id: "mov_" + (++state.movementSeq),
      productId: p.id,
      type: "receipt",
      qty: baseDelta,
      unit: l.unit,
      unitQty: l.qty,
      buyingPrice: l.cost,
      supplier,
      ref,
      note: `Received ${l.qty} ${U[l.unit]} from ${supplier}`,
      user: "Owner",
      at: new Date()
    });
  }

  toast(`Received ${state.receiveDraft.lines.length} line(s) from ${supplier}`);
  state.receiveDraft = {
    supplier: state.suppliers[0],
    invoiceRef: "",
    lines: [{ productId: 0, unit: "c", qty: 2, cost: 4800 }]
  };
  state.stockTab = "overview";
  render();
  return true;
}

function updateStockTakeCount(productId, count) {
  state.stockTakeDraft.counts[productId] = count === "" ? "" : Math.max(0, +count);
  render();
  keep("stk-cnt-" + productId);
}

function autoFillStockTake() {
  state.products.forEach(p => {
    state.stockTakeDraft.counts[p.id] = p.st;
  });
  render();
}

function clearStockTake() {
  state.stockTakeDraft.counts = {};
  render();
}

function setStockTakeMode(mode) {
  state.stockTakeDraft.mode = mode;
  render();
}

function submitStockTake() {
  const countEntries = Object.entries(state.stockTakeDraft.counts).filter(([id, cnt]) => cnt !== "");
  if (!countEntries.length) {
    toast("Enter at least one product count");
    return false;
  }

  let adjustedCount = 0;
  const ref = "STK-TAKE-" + new Date().toLocaleDateString("en-KE").replace(/\//g, "");

  countEntries.forEach(([idStr, counted]) => {
    const id = +idStr;
    const p = state.products.find(x => x.id === id);
    if (!p) return;
    const diff = (+counted) - p.st;
    if (Math.abs(diff) > 0.001) {
      const baseDelta = p.baseUnitsPerBottle > 1 ? Math.round(diff * p.baseUnitsPerBottle) : Math.round(diff);
      recordStockMovement({
        id: "mov_" + (++state.movementSeq),
        productId: p.id,
        type: "take",
        qty: baseDelta,
        unit: "b",
        unitQty: Math.abs(diff),
        ref,
        note: `Stock take adjustment (${diff > 0 ? "+" : ""}${diff} btl)`,
        user: "Owner",
        at: new Date()
      });
      adjustedCount++;
    }
  });

  toast(`Stock take posted · ${adjustedCount} adjustment(s) applied`);
  state.stockTakeDraft.counts = {};
  state.stockTakeDraft.mode = "blind";
  state.stockTab = "overview";
  render();
  return true;
}

function updateAdjustmentDraft(field, val) {
  state.adjustmentDraft[field] = val;
  render();
  keep("adj-note");
}

function submitAdjustment() {
  const d = state.adjustmentDraft;
  const p = state.products.find(x => x.id === d.productId);
  if (!p) {
    toast("Select a product");
    return false;
  }
  if (!d.reason) {
    toast("Reason is mandatory for adjustments");
    return false;
  }
  if (d.qty <= 0) {
    toast("Quantity must be greater than 0");
    return false;
  }

  const isLoss = d.direction === "loss";
  const baseDelta = toBaseUnits(p, d.unit, d.qty) * (isLoss ? -1 : 1);

  if (baseDelta < 0 && (getProductBaseUnits(p.id) + baseDelta) < 0) {
    toast("Adjustment blocked: reduction exceeds available stock");
    return false;
  }

  const ok = recordStockMovement({
    id: "mov_" + (++state.movementSeq),
    productId: p.id,
    type: "adjustment",
    qty: baseDelta,
    unit: d.unit,
    unitQty: d.qty,
    reason: d.reason,
    note: d.note.trim() || `${d.reason.toUpperCase()} adjustment`,
    ref: "ADJ-" + d.reason.slice(0, 6).toUpperCase(),
    user: "Owner",
    at: new Date()
  });

  if (!ok) {
    toast("Adjustment blocked: negative stock");
    return false;
  }

  toast(`Adjustment posted: ${isLoss ? "−" : "+"}${d.qty} ${U[d.unit]} ${p.n} (${d.reason})`);
  state.adjustmentDraft.note = "";
  state.stockTab = "history";
  render();
  return true;
}

function renderStockTakeTab() {
  const isBlind = state.stockTakeDraft.mode === "blind";
  const counts = state.stockTakeDraft.counts;
  const countEntries = Object.entries(counts).filter(([id, cnt]) => cnt !== "");
  let discrepancyCount = 0;
  let netVarianceValue = 0;

  countEntries.forEach(([idStr, val]) => {
    const p = state.products.find(x => x.id === +idStr);
    if (!p) return;
    const diff = (+val) - p.st;
    if (Math.abs(diff) > 0.001) {
      discrepancyCount++;
      netVarianceValue += diff * (p.b * 0.8);
    }
  });

  return `
  <div style="display:flex;flex-direction:column;gap:1rem">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem;margin-bottom:.8rem">
        <div>
          <h4>Stock Take (Physical Blind Count &amp; Variance Audit)</h4>
          <small class="mu">Count physical bottles, review variance against the ledger, and post adjustment movements with owner approval.</small>
        </div>
        <div class="chips" style="margin:0">
          <button class="${isBlind ? "on" : ""}" onclick="setStockTakeMode('blind')">Blind Count Mode</button>
          <button class="${!isBlind ? "on" : ""}" onclick="setStockTakeMode('review')">Review Variances (${discrepancyCount})</button>
        </div>
      </div>

      <div style="display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap">
        <button style="min-height:2.2rem;padding:0 .8rem;font-size:.82rem" onclick="autoFillStockTake()">Fill with current stock (demo)</button>
        <button class="ghost" style="min-height:2.2rem;padding:0 .8rem;font-size:.82rem" onclick="clearStockTake()">Clear counts</button>
      </div>

      <div style="overflow-x:auto">
        <table class="tab-tbl">
          <thead>
            <tr>
              <th>Product</th>
              <th>Category</th>
              <th style="text-align:right">${isBlind ? "Status" : "System stock"}</th>
              <th style="width:10rem;text-align:right">Physical count (btl)</th>
              <th style="text-align:right">Count variance</th>
              <th style="text-align:right">Financial impact</th>
            </tr>
          </thead>
          <tbody>
            ${state.products.map(p => {
              const entered = counts[p.id];
              const hasCount = entered !== undefined && entered !== "";
              const countNum = hasCount ? +entered : null;
              const diff = hasCount ? (countNum - p.st) : null;
              const costEst = Math.round(p.b * 0.8);
              const valDiff = diff !== null ? Math.round(diff * costEst) : null;

              return `
              <tr>
                <td><b>${p.n}</b> <small class="mu">${p.s}</small></td>
                <td>${p.g}</td>
                <td style="text-align:right">
                  ${isBlind ? `<span class="badge ${hasCount ? "b-rec" : "b-open"}">${hasCount ? "Counted" : "Pending"}</span>` : `<b>${fs(p.st)}</b> btl`}
                </td>
                <td style="text-align:right">
                  <input id="stk-cnt-${p.id}" type="number" min="0" step="1" placeholder="Enter btl…" value="${entered ?? ""}" oninput="updateStockTakeCount(${p.id}, this.value)" style="text-align:right;min-height:2.4rem">
                </td>
                <td style="text-align:right">
                  ${diff === null ? `<span class="mu">—</span>` :
                    diff === 0 ? `<span class="badge b-rec">Matched (0)</span>` :
                    diff < 0 ? `<span class="badge low">−${Math.abs(diff)} btl (Loss)</span>` :
                    `<span class="badge b-rec">+${diff} btl (Gain)</span>`}
                </td>
                <td style="text-align:right">
                  ${valDiff === null ? `<span class="mu">—</span>` :
                    valDiff === 0 ? `<span class="mu">KES 0</span>` :
                    valDiff < 0 ? `<b class="low">− ${kes(Math.abs(valDiff))}</b>` :
                    `<b class="ok">+ ${kes(valDiff)}</b>`}
                </td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem">
      <div style="display:flex;gap:1.5rem;align-items:center">
        <div><small class="mu">Products counted:</small> <b>${countEntries.length} / ${state.products.length}</b></div>
        <div><small class="mu">Discrepancies:</small> <b class="${discrepancyCount ? "low" : ""}">${discrepancyCount}</b></div>
        <div><small class="mu">Net variance:</small> <b class="${netVarianceValue < 0 ? "low" : "ok"}">${netVarianceValue < 0 ? "− " + kes(Math.abs(netVarianceValue)) : "+ " + kes(netVarianceValue)}</b></div>
      </div>
      <div style="display:flex;gap:.6rem">
        <button class="ghost" onclick="setStockTab('overview')">Cancel</button>
        <button class="pri" style="min-width:14rem" ${!countEntries.length ? "disabled" : ""} onclick="submitStockTake()">Approve &amp; Post Variances</button>
      </div>
    </div>
  </div>`;
}

function openProductEditor(id = null) {
  if (state.currentUser?.role !== "owner") {
    toast("Owner access required");
    return false;
  }
  if (id === null) {
    state.productEditor = { isNew: true, id: null };
    state.productDraft = { n: "", s: "750ml", g: "Spirits", b: 1000, k: 12, tn: 0, t: 0, reorderLevel: 1, preferredSupplier: state.suppliers[0], buyPrice: 650 };
  } else {
    const p = state.products.find(product => product.id === id);
    if (!p) return false;
    state.productEditor = { isNew: false, id };
    state.productDraft = { n: p.n, s: p.s, g: p.g, b: p.b, k: p.k, tn: p.tn, t: p.t, reorderLevel: p.reorderLevel, preferredSupplier: p.preferredSupplier, buyPrice: p.buyPrice };
  }
  render();
  return true;
}

function updateProductDraft(field, value) {
  const d = state.productDraft;
  if (!d) return false;
  const numeric = ["b", "k", "tn", "t", "reorderLevel", "buyPrice"].includes(field);
  const previousBottlePrice = d.b;
  d[field] = numeric ? Number(value) : value;
  if (field === "b" && d.tn && previousBottlePrice > 0) {
    d.t = Math.round(d.t * d.b / previousBottlePrice);
    const totPrice = $("product-tot-price");
    if (totPrice) totPrice.value = d.t;
  }
  const margin = $("product-margin");
  if (margin) margin.textContent = `${d.b > 0 ? ((d.b - d.buyPrice) / d.b * 100).toFixed(1) : "0.0"}% gross margin`;
  return true;
}

function cleanProductLabel(value) {
  return String(value).replace(/[<>\"]/g, "").trim();
}

function saveProductEditor(approved = false) {
  if (state.currentUser?.role !== "owner") {
    toast("Owner access required");
    return false;
  }
  const d = state.productDraft;
  if (!d || !cleanProductLabel(d.n) || !cleanProductLabel(d.s) || ![d.b,d.k,d.tn,d.t,d.reorderLevel,d.buyPrice].every(Number.isFinite) || d.b <= 0 || d.k <= 0 || d.tn < 0 || d.t < 0 || d.reorderLevel < 0 || d.buyPrice < 0) {
    toast("Enter a name, size, and valid product prices");
    return false;
  }
  if (state.productEditor.isNew) {
    const id = Math.max(-1, ...state.products.map(product => product.id)) + 1;
    const p = {
      id, n: cleanProductLabel(d.n), s: cleanProductLabel(d.s), g: d.g, b: d.b, k: Math.round(d.k), tn: Math.round(d.tn), t: Math.round(d.t),
      baseUnit: d.tn > 0 ? "tot" : "bottle", baseUnitsPerBottle: d.tn > 0 ? Math.round(d.tn) : 1,
      reorderLevel: d.reorderLevel, preferredSupplier: d.preferredSupplier, buyPrice: d.buyPrice,
      cp: Math.round(d.b * Math.round(d.k) * 0.97 / 10) * 10
    };
    Object.defineProperty(p, "st", { get() { return getProductStock(this.id); }, enumerable: true });
    state.products.push(p);
    addAuditEntry("Product added", `${p.n} · ${p.s}`);
  } else {
    const p = state.products.find(product => product.id === state.productEditor.id);
    const oldPrice = p.b, oldCartonPrice = p.cp, oldTotPrice = p.t, oldBuyPrice = p.buyPrice;
    const newCartonPrice = Math.round(d.b * Math.round(d.k) * 0.97 / 10) * 10;
    const priceChanged = oldPrice !== d.b || oldCartonPrice !== newCartonPrice || oldTotPrice !== Math.round(d.t) || oldBuyPrice !== d.buyPrice;
    if (priceChanged && !approved) {
      const summary = `${p.n}: bottle ${kes(oldPrice)} → ${kes(d.b)} · carton ${kes(oldCartonPrice)} → ${kes(newCartonPrice)} · buy ${kes(oldBuyPrice)} → ${kes(d.buyPrice)}`;
      requestOwnerApproval("Price override", summary, () => saveProductEditor(true));
      return false;
    }
    if (priceChanged) {
      state.priceChanges.push({ productId: p.id, productName: p.n, oldPrice, newPrice: d.b, oldCartonPrice, newCartonPrice, oldTotPrice, newTotPrice: Math.round(d.t), oldBuyPrice, newBuyPrice: d.buyPrice, user: currentActor(), at: new Date() });
    }
    p.n = cleanProductLabel(d.n); p.s = cleanProductLabel(d.s); p.g = d.g; p.b = d.b; p.k = Math.round(d.k); p.tn = Math.round(d.tn); p.t = Math.round(d.t);
    p.baseUnit = p.tn > 0 ? "tot" : "bottle"; p.baseUnitsPerBottle = p.tn > 0 ? p.tn : 1;
    p.reorderLevel = d.reorderLevel; p.preferredSupplier = d.preferredSupplier; p.buyPrice = d.buyPrice;
    p.cp = Math.round(p.b * p.k * 0.97 / 10) * 10;
    addAuditEntry("Product edited", `${p.n} · ${priceChanged ? "pricing updated" : "product details updated"}`);
  }
  state.productEditor = null;
  state.productDraft = null;
  render();
  toast("Product saved");
  return true;
}

  const counts = Object.entries(s.denominations).filter(([, count]) => Number(count) > 0).map(([value, count]) => `<div class="r m"><span>${count} × KES ${Number(value).toLocaleString("en-KE")}</span><span>${kes(Number(value)*Number(count))}</span></div>`).join("") || `<div class="r m"><span>No cash counted</span><span>${kes(0)}</span></div>`;
  return `<div class="ov"><div class="rw"><div class="rok">${IC.ok}<div><b>Shift closed</b><small>Owner sign-off recorded</small></div></div><div class="paper"><div class="c"><b style="font-size:1rem">CELLAR &amp; CO.</b><br>SHIFT SUMMARY<br><span class="m">Till ${s.tillNumber} · ${s.id}</span></div><hr><div class="r"><span>Cashier</span><b>${s.cashier}</b></div><div class="r m"><span>Opened</span><span>${s.openedAt.toLocaleString("en-KE")}</span></div><div class="r m"><span>Closed</span><span>${s.closedAt.toLocaleString("en-KE")}</span></div><div class="r m"><span>Transactions</span><span>${s.transactionCount}</span></div><hr><div class="r"><span>Opening float</span><b>${kes(s.openingFloat)}</b></div><div class="r m"><span>Cash sales</span><span>${kes(s.cashSales)}</span></div><div class="r"><span>Expected cash</span><b>${kes(s.cashExpected)}</b></div><div class="r m"><span>Counted cash</span><span>${kes(s.cashCounted)}</span></div>${counts}<div class="r"><span>Cash variance</span><b>${s.cashVariance>0?"+":""}${kes(s.cashVariance)}</b></div><hr><div class="r"><span>Expected M-Pesa</span><b>${kes(s.mpesaExpected)}</b></div><div class="r m"><span>M-Pesa received</span><span>${kes(s.mpesaReceived)}</span></div><div class="r"><span>M-Pesa variance</span><b>${s.mpesaVariance>0?"+":""}${kes(s.mpesaVariance)}</b></div><hr><div class="r tt"><span>TOTAL VARIANCE</span><span>${s.totalVariance>0?"+":""}${kes(s.totalVariance)}</span></div>${s.reason?`<div class="m">Reason: ${esc(s.reason)}</div>`:""}<hr><div class="r m"><span>Owner sign-off</span><b>${s.signedOffBy}</b></div></div><div class="ft"><button onclick="toast('Shift summary sent to printer (demo)')">Print summary</button><button class="pri" onclick="state.shiftReceipt=null;render()">Done</button></div></div></div>`;

function localDateKey(date) {
  const d = new Date(date);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function setAuditFilter(field, value) {
  const fields = { user: "auditFilterUser", action: "auditFilterAction", from: "auditFilterFrom", to: "auditFilterTo" };
  if (!fields[field]) return false;
  state[fields[field]] = value;
  render();
  return true;
}
function clearAuditFilters() {
  state.auditFilterUser = "all";
  state.auditFilterAction = "all";
  state.auditFilterFrom = "";
  state.auditFilterTo = "";
  render();
}
function auditView() {
  const users = [...new Set([...state.users.map(user => user.name), ...state.auditLog.map(entry => entry.user)])].sort();
  const actions = [...new Set(state.auditLog.map(entry => entry.action))].sort();
  const filtered = state.auditLog.slice().reverse().filter(entry => {
    const date = localDateKey(entry.at);
    return (state.auditFilterUser === "all" || entry.user === state.auditFilterUser) &&
      (state.auditFilterAction === "all" || entry.action === state.auditFilterAction) &&
      (!state.auditFilterFrom || date >= state.auditFilterFrom) &&
      (!state.auditFilterTo || date <= state.auditFilterTo);
  });
  return `<div class="audit-screen"><section class="card"><div class="audit-heading"><div><h3>Audit log</h3><small class="mu">Sign-ins, sales and owner-approved actions</small></div><span class="badge b-open">${filtered.length} entries</span></div><div class="audit-filters"><label>User<select aria-label="Filter by user" onchange="setAuditFilter('user',this.value)"><option value="all">All users</option>${users.map(user=>`<option value="${esc(user)}" ${state.auditFilterUser===user?"selected":""}>${esc(user)}</option>`).join("")}</select></label><label>Action<select aria-label="Filter by action" onchange="setAuditFilter('action',this.value)"><option value="all">All actions</option>${actions.map(action=>`<option value="${esc(action)}" ${state.auditFilterAction===action?"selected":""}>${esc(action)}</option>`).join("")}</select></label><label>From<input aria-label="Filter from date" type="date" value="${esc(state.auditFilterFrom)}" onchange="setAuditFilter('from',this.value)"></label><label>To<input aria-label="Filter to date" type="date" value="${esc(state.auditFilterTo)}" onchange="setAuditFilter('to',this.value)"></label><button class="ghost" onclick="clearAuditFilters()">Clear filters</button></div><div class="audit-list">${filtered.map(entry=>`<article class="audit-entry"><div><b>${esc(entry.action)}</b><small>${new Date(entry.at).toLocaleString("en-KE")}</small></div><div><span>${esc(entry.details)}</span><small>By ${esc(entry.user)}</small></div></article>`).join("")||`<p class="mu audit-empty">No matching activity.</p>`}</div></section></div>`;
}

// Payment & Receipt Modals
function pay() {
  const d = state.payment;
  const t = total();
  const phonePresent = !!String(d.phone || "").trim();
  let b, ok;
  if (d.m == "cash") {
    ok = d.tend >= t;
    const q = [t, ...[500, 1000, 2000, 5000].filter(x => x > t)].slice(0, 4);
    b = `<div><label class="fl" for="tend">Amount received</label><div class="inp"><span>KES</span><input id="tend" inputmode="numeric" value="${d.tend}" oninput="upd('tend',+this.value.replace(/\\D/g,''),'tend')"></div></div><div class="qk">${q.map(x=>`<button class="${x==d.tend?"on":""}" onclick="upd('tend',${x})">${x==t?"Exact":x.toLocaleString()}</button>`).join("")}</div><div class="sum ${ok?"good":"bad"}"><span>${ok?"Change due":"Still to pay"}</span><b>${kes(Math.abs(d.tend-t))}</b></div>`;
  } else if (state.offline) {
    ok = d.ref.length >= 8 && phonePresent;
    b = `<div><label class="fl" for="phone">Customer phone for receipt</label><div class="inp"><input id="phone" inputmode="tel" value="${esc(d.phone)}" oninput="upd('phone',this.value,'phone')"></div>${phonePresent?"":"<small class=\"low\">Enter a phone number to complete M-Pesa.</small>"}</div><div class="bn">Offline · enter the confirmation code from the customer’s M-Pesa SMS. It will be flagged for reconciliation.</div><div><label class="fl" for="ref">M-Pesa code</label><div class="inp"><input id="ref" placeholder="SJK4X9P2QA" value="${esc(d.ref)}" oninput="upd('ref',this.value.toUpperCase(),'ref')"></div></div>`;
  } else {
    ok = d.st == "ok" && phonePresent;
    b = `<div><label class="fl" for="phone">Customer phone for receipt</label><div class="inp"><input id="phone" inputmode="tel" value="${esc(d.phone)}" ${d.st=="idle"?"":"readonly"} oninput="upd('phone',this.value,'phone')"></div>${phonePresent?"":"<small class=\"low\">Enter a phone number to send M-Pesa and print it on the receipt.</small>"}</div>` + (ok ? `<div class="sum good"><span>Payment received</span><b>${esc(d.ref)}</b></div>` : `<button class="stk" ${d.st=="idle"&&phonePresent?"":"disabled"} onclick="stk()">${d.st=="wait"?label("waitingPin"):label("sendStk")}</button>`);
  }
  return `<div class="ov"><div class="mod"><div class="mh"><div><small>Amount due</small><h3>${kes(t)}</h3></div><button class="x" aria-label="Close · Esc" onclick="state.payment=null;render()">✕</button></div><div class="mt"><button class="${d.m=="cash"?"on":""}" onclick="upd('m','cash')">${IC.cash} ${label("cash")}</button><button class="${d.m=="mpesa"?"on":""}" onclick="upd('m','mpesa')">${IC.phone} ${label("mpesa")}</button></div><div class="mb">${b}</div><div class="ft"><button class="ghost" onclick="state.payment=null;render()">${label("cancel")}</button><button class="pri" style="flex:2" ${ok?"":"disabled"} onclick="finish()">${label("completeSale")}</button></div></div></div>`;
}

function rcpt() {
  const s = state.receipt;
  const receiptSettings = s.receiptSettings || state.shopSettings;
  const st = s.voided ? "Voided · stock restored" : s.m == "cash" ? "Cash received" : s.pend ? "M-Pesa · pending reconciliation" : "M-Pesa confirmed";
  const reprinting = state.receiptMode === "reprint";
  const lines = s.lines.map(l => {
    const gross = l.gross ?? l.q * l.pr;
    const lineDiscount = l.lineDiscount || 0;
    const net = l.net ?? gross - lineDiscount;
    return `<div><div class="r"><span>${esc(l.n)}</span><b>${net.toLocaleString()}</b></div><div class="m">${l.q} × ${l.pr.toLocaleString()} · ${esc(l.s)} · ${U[l.u]}${lineDiscount?` · ${l.discountPercent}% line discount − ${kes(lineDiscount)}`:""}</div></div>`;
  }).join("");
  const footer = receiptSettings.receiptFooter.trim().replace(/\r?\n/g,"<br>");
  return `<div class="ov"><div class="rw" style="--receipt-width:${Number(receiptSettings.paperWidth)}mm"><div class="rok">${IC.ok}<div><b>${reprinting?"Receipt ready":s.voided?"Sale voided":"Sale complete"}</b><small>${reprinting?"Last sale · reprint":""}${reprinting?" · ":""}${st}</small></div></div><div class="paper"><div class="c"><b class="receipt-shop-name">${esc(receiptSettings.name)}</b>${receiptSettings.receiptHeader.trim()?`<br>${esc(receiptSettings.receiptHeader).replace(/\r?\n/g,"<br>")}`:""}<br>${esc(receiptSettings.address)}<br><span class="m">KRA PIN ${esc(receiptSettings.kraPin)}</span></div><hr><div class="r"><span>${esc(s.no)}</span><span>${new Date(s.at).toLocaleString("en-KE",{dateStyle:"short",timeStyle:"short"})}</span></div><div class="r m"><span>${esc(s.user||"Cashier 1")}</span><span>Till ${s.tillNumber||1}</span></div>${s.m==="mpesa"&&s.phone?`<div class="r m"><span>Customer phone</span><span>${esc(s.phone)}</span></div>`:""}<hr>${lines}<hr>${s.lineDiscountAmount?`<div class="r m"><span>Line discounts</span><span>− ${kes(s.lineDiscountAmount)}</span></div>`:""}${s.billDiscountAmount?`<div class="r m"><span>Bill discount (${s.discountPercent}%)</span><span>− ${kes(s.billDiscountAmount)}</span></div>`:""}<div class="r m"><span>Subtotal${receiptSettings.vatEnabled?" (incl. VAT)":""}</span><span>${kes(s.subtotal)}</span></div><div class="r m"><span>Subtotal after discounts</span><span>${kes(s.t)}</span></div>${receiptSettings.vatEnabled?`<div class="r m"><span>VAT 16% (incl.)</span><span>${Math.round(s.t*16/116).toLocaleString()}</span></div>`:""}<div class="r tt"><span>TOTAL</span><span>${kes(s.t)}</span></div><div class="r m"><span>${s.m==="cash"?"Cash":"M-Pesa "+esc(s.ref||"")}</span><span>${s.m==="cash"?"Change "+(s.tend-s.t).toLocaleString():s.pend?"Pending":"Paid"}</span></div>${s.voided?`<div class="sum bad"><span>VOIDED</span><b>${esc(s.voidedBy||"Owner")}</b></div><div class="r m"><span>Reason</span><span>${esc(s.voidReason||"")}</span></div>`:""}<hr><div class="etims-receipt"><div class="qr">eTIMS<br>QR placeholder</div><div class="etims-receipt-fields"><b>eTIMS · demo preview</b><small>Control unit: ${esc(receiptSettings.controlUnitId)}</small><small>Serial: ${esc(receiptSettings.controlUnitSerial)}</small><small>Invoice: ${esc(s.no)}</small><small>Not submitted to KRA</small></div></div>${footer?`<hr><div class="c m receipt-footer">${footer}</div>`:""}</div><div class="ft">${!s.voided&&!reprinting?`<button class="ghost" onclick="requestSaleVoid('${esc(s.no)}')">${label("voidSale")}</button>`:""}<button onclick="toast('Receipt sent to printer (demo)')">${reprinting?label("reprintReceipt"):label("printReceipt")}</button><button class="pri" onclick="closeReceipt()">${reprinting?label("done"):label("newSale")}</button></div></div></div>`;
}

function discountView() {
  const draft = state.discountModal;
  if (!draft) return "";
  const title = draft.scope === "bill" ? "Bill discount" : "Line discount";
  const line = draft.scope === "line" ? state.cart[draft.index] : null;
  const product = line ? state.products.find(item => item.id === line.id) : null;
  return `<div class="ov"><section class="mod" role="dialog" aria-modal="true" aria-labelledby="discount-title"><div class="mh"><div><small>Discount controls</small><h3 id="discount-title">${title}</h3></div><button class="x" aria-label="Close · Esc" onclick="state.discountModal=null;render()">✕</button></div><div class="mb">${line?`<p>${esc(product?.n||"Item")} · ${line.q} ${U[line.u]}</p>`:`<p>Apply a percentage to the sale after line discounts.</p>`}<label class="fl" for="discount-percent">Discount percentage</label><div class="discount-field"><input id="discount-percent" type="number" min="0" max="100" step="0.5" inputmode="decimal" value="${esc(draft.percent)}" oninput="updateDiscountDraft(this.value)" onkeydown="if(event.key==='Enter')applyDiscount()"><b>%</b></div><small>Discounts above 5% require owner PIN approval.</small></div><div class="ft"><button onclick="state.discountModal=null;render()">Cancel</button><button class="pri" onclick="applyDiscount()">Apply discount</button></div></section></div>`;
}

function recallView() {
  if (!state.recallOpen) return "";
  const heldSales = heldForCurrentTill();
  return `<div class="ov"><section class="mod" role="dialog" aria-modal="true" aria-labelledby="recall-title"><div class="mh"><div><small>${heldSales.length} sale${heldSales.length===1?"":"s"} on hold</small><h3 id="recall-title">Recall sale</h3></div><button class="x" aria-label="Close · Esc" onclick="state.recallOpen=false;render()">✕</button></div><div class="mb">${heldSales.length?`<div class="held-list">${heldSales.map(held=>`<div class="held-sale"><b>Hold #${held.id} · ${kes(held.total)}</b><small>${held.cart.reduce((sum,line)=>sum+line.q,0)} items · ${esc(held.heldBy)} · ${new Date(held.heldAt).toLocaleTimeString("en-KE",{hour:"2-digit",minute:"2-digit"})}</small><button class="pri" onclick="recallHeldSale(${held.id})">Recall</button><button class="line-void" onclick="discardHeldSale(${held.id})">Discard</button></div>`).join("")}</div>`:`<p class="mu">No held sales. Use Hold sale from the cart to save a basket.</p>`}</div><div class="ft"><button onclick="state.recallOpen=false;render()">Close</button></div></section></div>`;
}

// Master Render Function
function render() {
  if (!state.currentUser) {
    $("app").innerHTML = loginView();
    return;
  }
  if (!state.cart.length) state.cartOpen = false;
  const curScreen = SCREENS[state.view] || SCREENS.sell;
  const screensList = visibleScreens();
  const pendingSync = syncPendingCount();

  $("app").innerHTML = `
<div class="app-shell">
  <!-- Desktop Persistent Side Navigation -->
  <aside class="side-nav" aria-label="Main Navigation">
    <div class="side-brand">
      <div class="brand">
        <b>Cellar POS</b>
        <span>Wines &amp; Spirits</span>
      </div>
    </div>
    <nav>
      ${screensList.map(s => `
        <button class="nav-btn ${state.view === s.id ? "on" : ""}" onclick="go('${s.id}')">
          ${NAV_ICONS[s.id] || ""}
          <span>${label(s.id)}</span>
        </button>
      `).join("")}
    </nav>
    <div class="side-foot">
      <div class="side-user">
        <b>${state.currentUser.name}</b>
        <small>${state.currentUser.role === "owner" ? "Owner · Full access" : `Cashier · Till ${state.till.tillNumber}`} · ${state.till.status === "open" ? `Float ${kes(state.till.float)}` : "Closed"}</small>
      </div>
    </div>
  </aside>

  <!-- Main View Area -->
  <div class="app-main">
    <header class="top">
      <div class="brand mobile-brand">
        <b>Cellar POS</b>
        <span>Prototype · demo data</span>
      </div>
      <div class="desktop-title">
        <b>${curScreen.title}</b>
        ${curScreen.subtitle ? `<span>${curScreen.subtitle}</span>` : ""}
      </div>
      <div class="rt">
        <span class="signed-in-user">${state.currentUser.name} · ${state.currentUser.role === "owner" ? "Owner" : `Till ${state.till.tillNumber}`}</span>
        <button class="pill sync-top ${pendingSync?"wn":""}" onclick="go('sync')">Sync · ${pendingSync}</button>
        <button class="pill ${state.offline ? "wn" : "ok"}" onclick="tOff()">● ${state.offline ? "Offline" : "Online"}</button>
        <button class="pill" onclick="tTheme()">Light / Dark</button>
        <button class="pill" onclick="logout()">Sign out</button>
      </div>
    </header>

    ${state.offline || pendingSync ? `<div class="sync-banner" role="status"><div><b>${state.offline?"Offline mode":"Records awaiting sync"}</b><small>${state.offline?"New sales and stock movements are saved on this device.":"Connection is available; queued records need a retry."}</small></div><strong>${pendingSync} pending</strong><button onclick="go('sync')">Open sync queue</button></div>` : ""}

    <main>
      ${renderScreen(state.view)}
    </main>
  </div>

  <!-- Mobile Persistent Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Mobile Navigation" style="grid-template-columns:repeat(${screensList.length},1fr)">
    ${screensList.map(s => `
      <button class="b-nav-btn ${state.view === s.id ? "on" : ""}" onclick="go('${s.id}')">
        ${NAV_ICONS[s.id] || ""}
        <span>${label(s.id)}</span>
      </button>
    `).join("")}
  </nav>
</div>
${state.payment ? pay() : ""}
${state.receipt ? rcpt() : ""}
${state.discountModal ? discountView() : ""}
${state.recallOpen ? recallView() : ""}
${state.productEditor ? productEditorView() : ""}
${state.tillFlow ? tillFlowView() : ""}
${state.shiftReceipt ? shiftRcpt() : ""}
${state.whatsappPreviewSupplier ? whatsappPreviewView() : ""}
${state.approval ? ownerApprovalView() : ""}
${state.currentUser.role === "owner" && !state.demoGuide.open ? `<button class="demo-guide-fab" aria-label="Open demo guide" title="Walk through the 8-step demo" onclick="openDemoGuide()">${IC.guide}<span>Demo guide</span></button>` : ""}
${state.demoGuide.open ? demoGuideView() : ""}
${state.resetDemoConfirm ? demoResetDialog() : ""}`;
  if (state.demoGuide.open) updateDemoSpotlight();
}

function handleGlobalShortcuts(event) {
  if (event.key === "Escape") {
    if (state.resetDemoConfirm) cancelDemoReset();
    else if (state.demoGuide.open) closeDemoGuide();
    else if (state.whatsappPreviewSupplier) closeWhatsAppPreview();
    else if (state.approval) cancelOwnerApproval();
    else if (state.payment) { state.payment = null; render(); }
    else if (state.receipt) closeReceipt();
    else if (state.discountModal) { state.discountModal = null; render(); }
    else if (state.recallOpen) { state.recallOpen = false; render(); }
    else if (state.productEditor) closeProductEditor();
    else if (state.tillFlow) cancelTillFlow();
    else if (state.shiftReceipt) { state.shiftReceipt = null; render(); }
    else if (state.cartOpen) { state.cartOpen = false; render(); }
    else return;
    event.preventDefault();
    return;
  }
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
  if (event.key === "F2") {
    event.preventDefault();
    if (!state.currentUser) return;
    if (state.payment || state.receipt || state.approval || state.discountModal || state.recallOpen || state.whatsappPreviewSupplier) return;
    if (state.view !== "sell" || state.cartOpen) {
      state.view = "sell";
      state.cartOpen = false;
      render();
    }
    keep("q");
    return;
  }
  if (event.key === "F4") {
    event.preventDefault();
    if (state.currentUser && state.view === "sell" && !state.payment && !state.receipt && !state.approval && !state.discountModal && !state.recallOpen) charge();
  }
}

if (document.addEventListener) document.addEventListener("keydown", handleGlobalShortcuts);
render();
</script></body></html>
