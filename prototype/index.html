<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cellar POS – Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--rs:8px;--rm:12px;--rl:16px;--bg:#f5f4f2;--card:#fff;--tile:#faf9f8;--bd:#e6e3df;--tx:#19171c;--mu:#6c6872;--ac:#8a1c3c;--act:#8a1c3c;--onac:#fff;--acs:rgba(138,28,60,.07);--gd:#b8893a;--ok:#1d7a4b;--wn:#c0392b;--wns:rgba(192,57,43,.09);--sh:0 1px 2px rgba(25,23,28,.05),0 6px 20px rgba(25,23,28,.05);--ov:rgba(25,23,28,.4);--ph1:#efe9e4;--ph2:#e2d9d1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0f;--card:#14141a;--tile:#1a1a21;--bd:#262630;--tx:#f2f0f4;--mu:#9a96a4;--ac:#b8294f;--act:#f08aa4;--acs:rgba(240,138,164,.1);--gd:#d6b06a;--ok:#4fc58a;--wn:#f07a6a;--wns:rgba(240,122,106,.12);--sh:0 12px 32px rgba(0,0,0,.45);--ov:rgba(0,0,0,.65);--ph1:#23232c;--ph2:#191920;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0f;--card:#14141a;--tile:#1a1a21;--bd:#262630;--tx:#f2f0f4;--mu:#9a96a4;--ac:#b8294f;--act:#f08aa4;--acs:rgba(240,138,164,.1);--gd:#d6b06a;--ok:#4fc58a;--wn:#f07a6a;--wns:rgba(240,122,106,.12);--sh:0 12px 32px rgba(0,0,0,.45);--ov:rgba(0,0,0,.65);--ph1:#23232c;--ph2:#191920;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:15px}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:1rem/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;background-image:radial-gradient(60rem 28rem at 90% -12%,var(--acs),transparent)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:var(--rs);min-height:2.75rem;padding:0 .9rem;transition:.15s}
button:hover:not(:disabled){border-color:var(--act)}
button:disabled{opacity:.4;cursor:not-allowed}
input{font:inherit;font-size:max(16px,1rem);color:inherit;background:var(--tile);border:1px solid var(--bd);border-radius:var(--rs);min-height:2.9rem;padding:0 .9rem;width:100%}
input:focus,button:focus-visible{outline:2px solid var(--act);outline-offset:1px}
small,.mu{color:var(--mu)}
.on{background:var(--acs)!important;border-color:var(--act)!important;color:var(--act)!important}
.pri{background:var(--ac)!important;color:var(--onac)!important;border-color:var(--ac)!important;font-weight:700;min-height:3.4rem;font-size:1.1rem}
.ghost{background:transparent}

/* Layout Shell */
.app-shell{display:flex;flex-direction:column;min-height:100%;height:100%;max-width:2400px;margin:0 auto}
.app-main{flex:1;display:flex;flex-direction:column;gap:.75rem;padding:.9rem;min-height:0;min-width:0;position:relative}
.top{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.brand b{font-size:1.15rem}.brand span{display:block;font-size:.8rem;color:var(--mu)}
.rt{margin-left:auto;display:flex;gap:.5rem}.rt button{min-height:2.5rem}.ok{color:var(--ok)}.wn{color:var(--wn)}
.bn{font-size:.85rem;color:var(--wn);background:var(--wns);border-radius:var(--rs);padding:.5rem .8rem}
main{flex:1;min-height:0;min-width:0;overflow:auto;overscroll-behavior:contain}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--sh);padding:1rem;min-width:0}
.card h4{margin:0;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}

/* Persistent Navigation (Desktop Side Nav / Mobile Bottom Nav) */
.side-nav{display:none}
.bottom-nav{display:none}

@media (min-width:1000px){
  .app-shell{flex-direction:row;height:100vh;overflow:hidden}
  .side-nav{display:flex;flex-direction:column;width:13.5rem;flex-shrink:0;background:var(--card);border-right:1px solid var(--bd);padding:1.25rem 1rem;gap:1.25rem;height:100%}
  .side-brand{padding:0 .25rem}
  .side-nav nav{display:flex;flex-direction:column;gap:.3rem;flex:1;overflow-y:auto}
  .nav-btn{display:flex;align-items:center;gap:.75rem;padding:0 .85rem;min-height:2.85rem;border:1px solid transparent;background:transparent;color:var(--tx);border-radius:var(--rm);font-weight:600;font-size:.92rem;text-align:left;width:100%;transition:.15s}
  .nav-btn:hover:not(:disabled){border-color:var(--act)}
  .nav-btn.on{background:var(--acs)!important;border-color:var(--act)!important;color:var(--act)!important}
  .nav-btn svg{width:1.2rem;height:1.2rem;flex-shrink:0}
  .side-foot{display:flex;flex-direction:column;gap:.5rem;border-top:1px solid var(--bd);padding-top:1rem}
  .side-user{padding:0 .25rem}
  .side-user b{display:block;font-size:.88rem}
  .side-user small{color:var(--mu);font-size:.78rem}
  .app-main{padding:1.25rem 1.5rem;gap:1.25rem;height:100%;overflow:hidden}
  .top .mobile-brand{display:none}
  .top .desktop-title b{font-size:1.15rem}
  .top .desktop-title span{display:block;font-size:.8rem;color:var(--mu)}
}

@media (max-width:999px){
  .side-nav{display:none}
  .app-shell{padding-bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));height:auto;min-height:100%}
  .app-main{padding:.75rem .75rem 1rem}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:12;display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border-top:1px solid var(--bd);padding:.3rem .15rem calc(.3rem + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(25,23,28,.05)}
  .b-nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:2.75rem;padding:.2rem 0;border:0;background:transparent;color:var(--mu);border-radius:var(--rs);transition:.15s}
  .b-nav-btn:hover{color:var(--tx)}
  .b-nav-btn.on{color:var(--act)!important;background:var(--acs)!important}
  .b-nav-btn svg{width:1.15rem;height:1.15rem;flex-shrink:0}
  .b-nav-btn span{font-size:.62rem;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .cbar{bottom:calc(4.4rem + env(safe-area-inset-bottom,0px));z-index:13}
  .toast{bottom:calc(4.8rem + env(safe-area-inset-bottom,0px))}
  .top .desktop-title{display:none}
}

/* Sell Screen Layout */
.sell{display:grid;grid-template-columns:minmax(0,1fr) 24rem;grid-template-rows:auto minmax(0,1fr);gap:.75rem;height:100%}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem}
.t{display:flex;flex-direction:column;justify-content:space-between;gap:.4rem}
.big{font-size:1.55rem;font-weight:700;line-height:1.2}
.sw{position:relative;width:3.2rem;height:1.9rem;min-height:1.9rem;border-radius:99px;padding:0}
.sw i{position:absolute;top:.2rem;left:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--mu);transition:.2s}
.sw.on{background:var(--ac)!important;border-color:var(--ac)!important}.sw.on i{left:1.5rem;background:#fff}
.prod{display:flex;flex-direction:column;gap:.75rem;min-height:0}
.chips{display:flex;gap:.4rem;overflow-x:auto}.chips button{flex:none;min-height:2.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.6rem;overflow:auto;padding:2px;align-content:start}
.pt{display:flex;flex-direction:column;align-items:stretch;gap:.2rem;text-align:left;padding:.55rem;border-radius:var(--rm);background:var(--tile);min-height:0}
.pt:hover:not(:disabled){border-color:var(--gd);transform:translateY(-2px)}.pt:active{transform:scale(.98)}
.pt b{font-size:.92rem;line-height:1.2;margin-top:.35rem}.pt .pr{font-weight:700}
.ph{display:grid;place-items:center;overflow:hidden;color:var(--mu);background:#fff;border:1px solid var(--bd);border-radius:var(--rs);aspect-ratio:4/3;width:100%}
.ph img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
.ph.th{width:2.9rem;aspect-ratio:1;grid-row:span 2;align-self:center}
.low{color:var(--wn);font-size:.8rem}
.cart{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;gap:.75rem;min-height:0}
.chead{display:flex;justify-content:space-between;align-items:center}.cclose{display:none;min-height:2.3rem}
.lines{flex:1;overflow:auto;display:flex;flex-direction:column;gap:.5rem}
.ln{display:grid;grid-template-columns:auto 1fr auto;gap:.4rem .7rem;padding:.6rem;border:1px solid var(--bd);border-radius:var(--rm);background:var(--tile);align-items:center}
.ln .lp{font-weight:700;text-align:right}
.line-tools{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;grid-column:2}
.line-tools button{min-height:2.2rem;padding:0 .6rem;font-size:.78rem}
.line-tools .line-void{color:var(--wn)}
.seg{display:flex;gap:.2rem;padding:.2rem;background:var(--bg);border-radius:var(--rm);justify-self:start}
.seg button{min-height:2.2rem;border:0;background:transparent;padding:0 .75rem}
.qty{display:flex;align-items:center;gap:.4rem;justify-self:end}.qty button{width:2.3rem;min-height:2.3rem;padding:0}
.cart-commands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem}
.cart-commands button{min-height:2.7rem;padding:0 .45rem;font-size:.82rem}
.scan-tools{display:flex;align-items:stretch;gap:.5rem}
.scan-tools input{min-width:0;flex:1}
.scan-tools button{flex:none;min-height:2.9rem;padding:0 .7rem;font-size:.8rem}
.scan-tools kbd,.pri kbd{border:1px solid currentColor;border-radius:4px;padding:.05rem .25rem;font:700 .68rem ui-monospace,Menlo,Consolas,monospace;opacity:.78}
.cart-total-discount{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.cart-total-discount button{min-height:2.5rem;padding:0 .7rem;font-size:.82rem}
.held-list{display:flex;flex-direction:column;gap:.55rem}
.held-sale{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.2rem .5rem;align-items:center;padding:.75rem;border:1px solid var(--bd);border-radius:var(--rm);background:var(--tile)}
.held-sale b,.held-sale small{grid-column:1}
.held-sale button{grid-column:auto;grid-row:1/3;min-width:4.5rem}
.discount-field{display:flex;align-items:center;gap:.6rem}.discount-field input{text-align:right;font-weight:700}
@media (pointer:coarse){.line-tools button,.seg button,.qty button,.cart-commands button,.cart-total-discount button,.scan-tools button{min-height:44px}.qty button{width:44px}.pt{min-height:44px}.pt:hover:not(:disabled){transform:none}.pt:active{transform:scale(.98)}}
.tot{border-top:1px dashed var(--bd);padding-top:.7rem;display:flex;flex-direction:column;gap:.25rem}.tot div{display:flex;justify-content:space-between}
.empty{margin:auto;text-align:center;color:var(--mu)}

/* Dashboard & Reports Layout */
.dash{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.75rem;overflow:auto;height:100%;align-content:start}.s2{grid-column:span 2}
.row{display:flex;justify-content:space-between;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.bar{height:.5rem;border-radius:var(--rs);background:var(--acs);margin-top:.25rem}.bar i{display:block;height:100%;border-radius:var(--rs);background:var(--ac)}

/* Modals & Overlays */
.ov{position:fixed;inset:0;background:var(--ov);display:grid;place-items:center;padding:1rem;z-index:20}
.mod{width:min(28rem,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:.75rem}.mod h3{margin:0;font-size:1.4rem}
.ft{display:flex;gap:.5rem}.ft button{flex:1}
.rc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;display:flex;flex-direction:column;gap:.2rem}.rc .row{border:0;padding:1px 0}.rc hr{border:0;border-top:1px dashed var(--mu);width:100%;margin:.4rem 0}
.qr{width:4.5rem;height:4.5rem;border:2px dashed var(--mu);border-radius:var(--rs);display:grid;place-items:center;font-size:.65rem;color:var(--mu);margin:.4rem auto}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);display:flex;align-items:center;gap:.55rem;max-width:min(36rem,calc(100vw - 2rem));background:var(--ac);color:#fff;padding:.65rem 1rem;border-radius:var(--rs);z-index:60;font-weight:700;box-shadow:var(--sh)}.toast-success{background:var(--ok)}.toast-error{background:var(--wn)}.toast-info{background:var(--ac)}.toast-icon{display:inline-flex;flex:none}.toast-icon svg{width:1.1rem;height:1.1rem}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;min-height:9rem;padding:1.2rem;text-align:center;color:var(--mu)}.empty-state>b{color:var(--tx)}.empty-state>small{max-width:32rem}.empty-state-icon{display:grid;place-items:center;width:2.75rem;height:2.75rem;margin-bottom:.25rem;border-radius:50%;background:var(--acs);color:var(--act)}.empty-state-icon svg{width:1.4rem;height:1.4rem}
.loading-skeleton{display:flex;flex-direction:column;gap:.4rem;margin:.45rem 0}.skeleton-line{display:block;height:.55rem;width:70%;border-radius:99px;background:linear-gradient(90deg,var(--tile) 20%,var(--bd) 45%,var(--tile) 70%);background-size:220% 100%;animation:skeleton-shimmer 1.1s linear infinite}.skeleton-line-2{width:48%}.skeleton-line-3{width:82%}@keyframes skeleton-shimmer{to{background-position:-220% 0}}
.demo-guide-fab{position:fixed;right:1.1rem;bottom:1.1rem;z-index:18;display:inline-flex;align-items:center;gap:.45rem;min-height:46px;padding:0 .9rem;border-radius:99px;background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:800;box-shadow:var(--sh)}.demo-guide-fab svg{width:1.2rem;height:1.2rem}
#demo-spotlight{position:fixed;z-index:40;left:50%;top:50%;width:1px;height:1px;border:2px solid var(--gd);border-radius:var(--rm);box-shadow:0 0 0 9999px rgba(16,14,20,.62);pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s}
.demo-guide-card{position:fixed;right:1rem;bottom:1rem;z-index:41;width:min(27rem,calc(100vw - 2rem));display:flex;flex-direction:column;gap:.65rem;padding:1rem;background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:0 18px 60px rgba(0,0,0,.25)}.demo-guide-head{display:flex;align-items:center;gap:.65rem}.demo-guide-head>div{min-width:0;flex:1}.demo-guide-mark{display:grid;place-items:center;flex:none;width:2.5rem;height:2.5rem;border-radius:50%;background:var(--acs);color:var(--act)}.demo-guide-mark svg{width:1.35rem;height:1.35rem}.demo-guide-head small{color:var(--mu);font-weight:700}.demo-guide-head h2{margin:0;font-size:1.05rem}.demo-guide-close{width:2.5rem;min-height:2.5rem;padding:0;font-size:1.35rem}.demo-guide-progress{height:.3rem;border-radius:99px;background:var(--tile);overflow:hidden}.demo-guide-progress i{display:block;height:100%;background:var(--ac);transition:width .2s}.demo-guide-card>p{margin:0;color:var(--mu);font-size:.9rem;line-height:1.5}.demo-guide-footer,.demo-guide-links{display:flex;gap:.5rem}.demo-guide-footer button,.demo-guide-links button{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:44px}.demo-guide-footer button{flex:1}.demo-guide-footer button svg,.demo-guide-links button svg{width:1.1rem;height:1.1rem}.demo-guide-links button{flex:1;padding:0 .45rem;font-size:.8rem}.reset-demo-overlay{z-index:55}.reset-demo-dialog{width:min(29rem,100%);padding:1.1rem;background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--sh)}.reset-demo-dialog h3{margin:0}.reset-demo-dialog p{margin:0;color:var(--mu)}.reset-confirm{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-size:.92rem}.reset-confirm svg{width:1.1rem;height:1.1rem}
.cbar{display:none;position:fixed;left:.75rem;right:.75rem;bottom:calc(.75rem + env(safe-area-inset-bottom,0px));z-index:10;justify-content:space-between;align-items:center;background:var(--ac)!important;color:var(--onac)!important;border-color:var(--ac)!important;min-height:3.4rem;font-weight:600;box-shadow:var(--sh)}

@media (max-width:999px){
  .sell{display:flex;flex-direction:column;height:auto}.grid{overflow:visible}.dash{grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}
  .cart{position:fixed;inset:0;z-index:15;border-radius:0;border:0;transform:translateY(100%);visibility:hidden;transition:.25s;padding-top:calc(1rem + env(safe-area-inset-top,0px));padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
  .cart.open{transform:none;visibility:visible}.cclose{display:block}.cbar{display:flex}
}
@media (max-width:640px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles>:first-child{grid-column:1/-1}.dash{grid-template-columns:1fr}.s2{grid-column:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ov{place-items:end center;padding:0}.mod{width:100%;border-radius:var(--rl) var(--rl) 0 0}.big{font-size:1.4rem}
  .scan-tools{display:grid;grid-template-columns:minmax(0,1fr) auto}.scan-tools input{grid-column:1/-1}.scan-tools button{width:100%;padding:0 .5rem}.line-tools{gap:.25rem}.line-tools button{padding:0 .45rem}.cart-commands button{font-size:.76rem}
}
@media (max-width:999px){.demo-guide-fab{right:.75rem;bottom:calc(4.9rem + env(safe-area-inset-bottom,0px))}.demo-guide-card{right:.5rem;bottom:calc(4.8rem + env(safe-area-inset-bottom,0px));width:calc(100vw - 1rem)}}
@media (max-width:420px){.demo-guide-card{padding:.8rem}.demo-guide-links{flex-direction:column}.demo-guide-fab{min-width:46px;justify-content:center}.demo-guide-fab span{display:none}}
@media (min-width:1600px){html{font-size:16.5px}.sell{grid-template-columns:minmax(0,1fr) 28rem}}
@media (min-width:2200px){html{font-size:20px}}

*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
@supports (color:color-mix(in srgb,red,blue)){*{scrollbar-color:color-mix(in srgb,var(--mu) 45%,transparent) transparent}}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}::-webkit-scrollbar-button{display:none}
::-webkit-scrollbar-thumb{background:var(--bd);border:3px solid transparent;background-clip:content-box;border-radius:var(--rs)}
::-webkit-scrollbar-thumb:hover{background:var(--mu);background-clip:content-box}

.tiles,.sell{gap:1rem}.top{gap:1rem}.cart{gap:1rem}.prod{gap:1rem}.dash{gap:1rem}
.t{gap:.6rem}.lines{gap:.6rem;padding-right:.3rem}.tot{padding-top:.9rem;gap:.35rem}.row{padding:.6rem 0}
.chips{gap:.5rem;padding:.2rem}.chips button{padding:0 1rem;min-height:2.4rem}
.grid{gap:.75rem;padding:.2rem .6rem .2rem .2rem;grid-auto-rows:max-content}
.pt{padding:.7rem;gap:.15rem;min-height:auto}.pt b{margin-top:.5rem;font-size:.95rem}.pt .pr{margin-top:.25rem}
.ln{padding:.75rem;gap:.55rem .8rem}
@media (min-width:641px){.card{padding:1.25rem}}
.mod{padding:0;gap:0;overflow:hidden;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);box-shadow:var(--sh);width:min(28rem,100%)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;padding:1.25rem 1.25rem 1rem}.mh h3{margin:.1rem 0 0;font-size:2rem;line-height:1.1}.x{width:2.5rem;min-height:2.5rem;padding:0}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:0 1.25rem}.mt button{display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;border-radius:var(--rm)}
.mb{padding:1.25rem;display:flex;flex-direction:column;gap:1rem;overflow:auto}.mod .ft{padding:1rem 1.25rem;border-top:1px solid var(--bd)}
.i{width:1.2rem;height:1.2rem;flex:none}
.fl{display:block;font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin-bottom:.45rem}
.inp{display:flex;align-items:center;gap:.6rem;background:var(--tile);border:1px solid var(--bd);border-radius:var(--rm);padding:0 1rem}.inp span{color:var(--mu);font-weight:600}
.inp input{border:0;outline:0;background:transparent;font-size:1.4rem;font-weight:700;min-height:3.5rem;padding:0}.inp:focus-within{border-color:var(--act);box-shadow:0 0 0 3px var(--acs)}
.qk{display:grid;grid-template-columns:repeat(auto-fit,minmax(5rem,1fr));gap:.5rem}
.sum{display:flex;justify-content:space-between;align-items:center;padding:1rem;border-radius:var(--rm)}.sum b{font-size:1.5rem}

// Helper: convert quantity in unit to base units (tot for spirits that sell tots, bottle otherwise)
function toBaseUnits(p, u, qty) {
  const factor = p.baseUnitsPerBottle || (p.tn > 0 ? p.tn : 1);
  if (p.baseUnit === "tot") {
    if (u === "t") return Math.round(qty);
    if (u === "b") return Math.round(qty * factor);
    if (u === "c") return Math.round(qty * p.k * factor);
  } else {
    if (u === "b") return Math.round(qty);
    if (u === "c") return Math.round(qty * p.k);
  }
  return Math.round(qty);
}

// Derived Stock Calculations (base units in ledger -> converted to bottles only for display)
function getProductBaseUnits(productId) {
  return state.stockMovements
    .filter(m => m.productId === productId)
    .reduce((sum, m) => sum + m.qty, 0);
}

function getProductStock(productId) {
  const p = state.products.find(x => x.id === productId);
  if (!p) return 0;
  const baseUnits = getProductBaseUnits(productId);
  return p.baseUnitsPerBottle > 1 ? baseUnits / p.baseUnitsPerBottle : baseUnits;
}

function reorderThreshold(p) { return p.reorderLevel * p.k; }
function isLowStock(p) { return p.st <= reorderThreshold(p); }
function onHandLabel(p) {
  const bottles = p.st, cartons = Math.floor(bottles / p.k);
  const loose = Math.round((bottles - cartons * p.k) * 10) / 10;
  const amount = `${cartons} ctn + ${fs(loose)} btl`;
  return p.tn ? `${amount} (${fs(bottles * p.tn)} tots)` : amount;
}
function productCostPerBottle(p) {
  return p.buyPrice;
}

// Append a stock movement to the ledger while honoring the zero-stock sale policy
function recordStockMovement(m) {
  m.qty = Math.round(m.qty);
  const currentBase = getProductBaseUnits(m.productId);
  if (state.zeroStockPolicy === "block" && m.type === "sale" && m.qty < 0 && (currentBase + m.qty) < 0) {
    return false; // Block negative stock
  }
  if (state.offline) {
    m.syncTracked = true;
    m.syncStatus = "pending";
    m.syncAttempts = 0;
    m.syncQueuedAt = new Date();
  }
  state.stockMovements.push(m);
  return true;
}

  return p ? price(p, l.u) * l.q : 0;
};
const lineDiscountAmount = l => lineGross(l) - Math.round(lineGross(l) * (1 - (Number(l.discountPercent) || 0) / 100));
const lineNet = l => lineGross(l) - lineDiscountAmount(l);
const cartSubtotal = () => state.cart.reduce((a, l) => {
  return a + lineGross(l);
}, 0);
const cartAfterLineDiscounts = () => state.cart.reduce((sum, l) => sum + lineNet(l), 0);
const cartDiscountAmount = () => cartAfterLineDiscounts() - Math.round(cartAfterLineDiscounts() * (1 - (Number(state.cartDiscountPercent) || 0) / 100));
const total = () => cartAfterLineDiscounts() - cartDiscountAmount();

function outsideTradingHours(now = new Date()) {
  if (!state.shopSettings.tradingHoursReminder) return false;
  const toMinutes = value => {
    const match = /^(\d{2}):(\d{2})$/.exec(value || "");
    return match ? Number(match[1]) * 60 + Number(match[2]) : NaN;
  };
  const opening = toMinutes(state.shopSettings.openingTime);
  const closing = toMinutes(state.shopSettings.closingTime);
  if (!Number.isFinite(opening) || !Number.isFinite(closing) || opening === closing) return false;
  const current = now.getHours() * 60 + now.getMinutes();
  return opening < closing ? current < opening || current >= closing : current >= closing && current < opening;
}

function openDiscountEditor(scope, index = null) {
  if (!state.cart.length) return false;
  const line = scope === "line" ? state.cart[index] : null;
  if (scope === "line" && !line) return false;
  state.discountModal = {
    scope,
    index,
    percent: String(scope === "bill" ? state.cartDiscountPercent : line.discountPercent || 0)
  };
  render();
  return true;
}
function updateDiscountDraft(value) {

}
function applyDiscountPercent(scope, index, requestedPercent) {
  const percent = Number(requestedPercent);
  if (!Number.isFinite(percent) || percent < 0 || percent > 100) {
    toast("Enter a discount from 0% to 100%");
    return false;
  }
  const line = scope === "line" ? state.cart[index] : null;
  if (scope === "line" && !line) return false;
  const previousPercent = Number(scope === "bill" ? state.cartDiscountPercent : line.discountPercent) || 0;
  const projectedLines = state.cart.map((item, i) => ({ ...item, discountPercent: scope === "line" && i === index ? percent : Number(item.discountPercent) || 0 }));
  const projectedBeforeBill = projectedLines.reduce((sum, item) => sum + lineNet(item), 0);
  const projectedBillPercent = scope === "bill" ? percent : Number(state.cartDiscountPercent) || 0;
  const projectedTotal = Math.round(projectedBeforeBill * (1 - projectedBillPercent / 100));
  const effectiveDiscountPercent = cartSubtotal() ? (cartSubtotal() - projectedTotal) * 100 / cartSubtotal() : 0;
  const discountIncreased = percent > previousPercent;
  const details = scope === "bill"
    ? `Bill discount ${percent}% (${kes(cartAfterLineDiscounts() - projectedTotal)}) · ${state.cart.map(item => `${item.q} ${U[item.u]} ${state.products.find(product => product.id === item.id)?.n || "item"}`).join(", ")}`
    : `Line discount ${percent}% · ${line.q} ${U[line.u]} ${state.products.find(p => p.id === line.id)?.n || "item"}`;
  const apply = () => {
    if (scope === "bill") state.cartDiscountPercent = percent;
    else line.discountPercent = percent;
    state.discountModal = null;
    render();
  };

  state.discountModal = null;
  if (discountIncreased && (percent > 5 || effectiveDiscountPercent > 5)) {
    requestOwnerApproval("Discount", details, apply);
  } else {
    addAuditEntry("Discount", `${details} · applied without owner approval`);
    apply();
  }
  return true;
}
function applyDiscount() {
  const draft = state.discountModal;
  if (!draft) return false;
  return applyDiscountPercent(draft.scope, draft.index, draft.percent);
}
function requestCartDiscount() {
  return applyDiscountPercent("bill", null, 10);
}

function heldSaleSnapshot() {
  if (!state.cart.length) return false;
  const held = {
    id: ++state.heldSaleSeq,
    cart: state.cart.map(line => ({ ...line })),
    cartDiscountPercent: state.cartDiscountPercent,
    total: total(),
    heldAt: new Date(),
    heldBy: currentActor(),
    tillNumber: state.till.tillNumber
  };
  state.heldSales.unshift(held);
  return held;
}
function holdSale() {
  const held = heldSaleSnapshot();
  if (!held) {
    toast("Add items before holding a sale");
    return false;
  }
  state.cart = [];
  state.cartDiscountPercent = 0;
  state.ageVerified = false;
  state.cartOpen = false;
  addAuditEntry("Sale held", `Hold #${held.id} · ${kes(held.total)}`);
  toast("Sale held");
  render();
  return true;
}
function openRecall() {

function recallHeldSale(id) {
  const held = state.heldSales.find(item => item.id === id && item.tillNumber === state.till.tillNumber);
  if (!held) return false;
  if (state.cart.length) {
    const saved = heldSaleSnapshot();
    addAuditEntry("Sale held", `Hold #${saved.id} · ${kes(saved.total)} · saved while recalling another sale`);
  }
  state.heldSales = state.heldSales.filter(item => item.id !== held.id);
  state.cart = held.cart.map(line => ({ ...line }));
  state.cartDiscountPercent = held.cartDiscountPercent || 0;
  state.ageVerified = false;
  state.cartOpen = true;
  state.recallOpen = false;
  addAuditEntry("Sale recalled", `Hold #${held.id} · ${kes(held.total)}`);
  render();
  return true;
}
function discardHeldSale(id) {
  const held = state.heldSales.find(item => item.id === id && item.tillNumber === state.till.tillNumber);
  if (!held) return false;
  state.heldSales = state.heldSales.filter(item => item.id !== id);
  addAuditEntry("Held sale discarded", `Hold #${id} · ${kes(held.total)}`);
  render();
  return true;
}

  state.ageVerified = false;
  state.view = "sell";
  render();

}
function canAccessScreen(screenId) {

}
function visibleScreens() {

}
function requestOwnerApproval(action, details, onApproved) {

}
function updateApprovalReason(value) {
  state.approvalReason = value;

}
function cancelOwnerApproval() {

}
function approveOwnerAction() {
  if (!state.approval) return false;

function navigateTo(v) {

// Core Actions
function tOff() {
  state.offline = !state.offline;
  render();
  if (state.offline) toast("Offline mode enabled · local changes will queue for sync");
  else toast(`${syncPendingCount()} record${syncPendingCount()===1?"":"s"} ready to retry`);
}

function syncQueueItems(includeSynced = false) {
  const sales = state.sales.filter(sale => sale.syncTracked).map(sale => ({
    queueId: `sale:${sale.no}`,
    kind: "Sale",
    title: sale.no,
    detail: `${sale.lines.map(line => `${line.n} × ${line.q}`).join(", ")} · ${sale.m === "mpesa" ? `M-Pesa · ${sale.ref} · ${sale.phone||"no phone"}` : "Cash"} · ${kes(sale.t)}`,
    reference: sale.no,
    record: sale,
    at: sale.syncQueuedAt || sale.at,
    status: sale.syncStatus || "pending"
  }));
  const movements = state.stockMovements.filter(movement => movement.syncTracked).map(movement => {
    const product = state.products.find(item => item.id === movement.productId);
    return {
      queueId: `movement:${movement.id}`,
      kind: "Stock movement",
      title: product?.n || "Stock item",
      detail: `${movement.type} · ${movement.note || `${movement.unitQty || Math.abs(movement.qty)} ${U[movement.unit] || "units"}`} · ${movement.ref || "No reference"}`,
      reference: movement.ref || movement.id,
      record: movement,
      at: movement.syncQueuedAt || movement.at,
      status: movement.syncStatus || "pending"
    };
  });
  return [...sales, ...movements]
    .filter(item => includeSynced || item.status !== "synced")
    .sort((a, b) => new Date(b.at) - new Date(a.at));
}

function syncPendingCount() {
  return syncQueueItems().length;
}

function runSyncRetry(items) {
  const queue = items.filter(item => item.status !== "synced" && item.status !== "syncing");
  if (!queue.length) {
    toast("No records are waiting to sync");
    return false;
  }
  queue.forEach(item => {
    item.record.syncAttempts = (item.record.syncAttempts || 0) + 1;
    item.record.syncLastAttemptAt = new Date();
    item.record.syncError = "";
  });
  if (state.offline) {
    queue.forEach(item => {
      item.record.syncStatus = "failed";
      item.record.syncError = "Device is offline. Reconnect and retry.";
    });
    render();
    toast(`${queue.length} record${queue.length===1?"":"s"} could not sync while offline`);
    return false;
  }
  queue.forEach(item => { item.record.syncStatus = "syncing"; });
  render();
  setTimeout(() => {
    let synced = 0;
    queue.forEach(item => {
      if (item.record.syncStatus !== "syncing") return;
      if (state.offline) {
        item.record.syncStatus = "failed";
        item.record.syncError = "Connection dropped during retry.";
      } else {
        item.record.syncStatus = "synced";
        item.record.syncError = "";
        item.record.syncedAt = new Date();
        synced++;
      }
    });
    render();
    toast(`${synced} record${synced===1?"":"s"} synced${state.offline ? " · connection lost" : ""}`);
  }, 750);
  return true;
}

function retrySyncItem(queueId) {
  const item = syncQueueItems(true).find(candidate => candidate.queueId === queueId);
  if (!item) return false;
  return runSyncRetry([item]);
}

function retryAllSyncItems() {
  return runSyncRetry(syncQueueItems());
}

function syncQueueView() {
  const pending = syncQueueItems();
  const recent = syncQueueItems(true).filter(item => item.status === "synced").slice(0, 8);
  const itemRow = item => `<article class="sync-row"><div class="sync-main"><div class="sync-row-title"><div><b>${esc(item.kind)} · ${esc(item.title)}</b><small>${new Date(item.at).toLocaleString("en-KE")} · ${esc(item.reference)}</small></div><span class="sync-status sync-${esc(item.status)}">${item.status === "syncing" ? "Syncing" : item.status === "failed" ? "Failed" : item.status === "synced" ? "Synced" : "Pending"}</span></div><p>${esc(item.detail)}</p>${item.record.syncError ? `<small class="low">${esc(item.record.syncError)}</small>` : ""}<small class="mu">${item.record.syncAttempts || 0} retry attempt${item.record.syncAttempts===1?"":"s"}${item.record.syncLastAttemptAt ? ` · Last tried ${new Date(item.record.syncLastAttemptAt).toLocaleTimeString("en-KE")}` : ""}</small></div><button class="row-action" ${item.status === "syncing" || item.status === "synced" ? "disabled" : ""} onclick="retrySyncItem('${esc(item.queueId)}')">${item.status === "synced" ? "Synced" : "Retry"}</button></article>`;
  return `<div class="offline-screen"><div class="offline-heading"><div><h2>Sync queue</h2><small class="mu">Offline sales and stock movements saved on this device</small></div><div class="offline-actions"><span class="badge ${state.offline?"b-adj":"b-rec"}">${state.offline?"Offline":"Online"}</span><button onclick="tOff()">${state.offline?"Go online":"Simulate offline"}</button>${state.currentUser.role === "owner" ? `<button onclick="go('reconcile')">M-Pesa reconciliation</button>` : ""}</div></div>
<div class="offline-stats"><section class="card"><h4>Waiting to sync</h4><div class="report-kpi ${pending.length?"low":"ok"}">${pending.length}</div><small>${pending.filter(item=>item.status==="failed").length} failed · ${pending.filter(item=>item.status==="syncing").length} in progress</small></section><section class="card"><h4>Offline M-Pesa</h4><div class="report-kpi">${pendingMpesaReconciliationCount()}</div><small>Payments awaiting owner review</small></section></div>
<section class="card"><div class="offline-section-head"><div><h3>Queued records</h3><small class="mu">Each sale and stock movement retries independently</small></div><button class="pri" ${pending.length?"":"disabled"} onclick="retryAllSyncItems()">Retry all</button></div><div class="sync-list">${pending.map(itemRow).join("")||emptyState("Sync queue is clear.","Sales and stock changes recorded while offline will appear here.")}</div></section>
<section class="card"><h3>Recently synced</h3><small class="mu">Latest completed retries from this session</small><div class="sync-list sync-recent">${recent.map(itemRow).join("")||emptyState("No synced records yet.","Completed retries from this session will appear here.")}</div></section></div>`;
}

function offlineMpesaSales() {
  return state.sales.filter(sale => sale.m === "mpesa" && sale.pend);
}

function pendingMpesaReconciliationCount() {
  return offlineMpesaSales().filter(sale => (sale.reconciliationStatus || "pending") === "pending").length;
}

function normalizeMpesaCode(code) {
  return String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
}

function parseStatementAmount(amount) {
  if (!String(amount ?? "").trim()) return NaN;
  const value = String(amount || "").replace(/,/g, "").replace(/[^0-9.-]/g, "");
  const parsed = Number(value);
  return Number.isFinite(parsed) ? parsed : NaN;
}

function splitStatementRow(line, delimiter) {
  const fields = [];
  let value = "", quoted = false;
  for (let index = 0; index < line.length; index++) {
    const character = line[index];
    if (character === '"' && line[index + 1] === '"' && quoted) {
      value += '"';
      index++;
    } else if (character === '"') quoted = !quoted;
    else if (character === delimiter && !quoted) {
      fields.push(value.trim());
      value = "";
    } else value += character;
  }
  fields.push(value.trim());
  return fields;
}

function importMpesaStatement() {
  const lines = state.mpesaStatementInput.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
  if (!lines.length) {
    state.mpesaStatementError = "Paste statement rows before importing.";
    render();
    return false;
  }
  const delimiter = lines[0].includes("\t") ? "\t" : lines[0].includes(";") ? ";" : ",";
  const firstRow = splitStatementRow(lines[0], delimiter).map(value => value.toLowerCase());
  const codeIndex = firstRow.findIndex(value => /transaction|receipt|reference|\bcode\b/.test(value));
  const amountIndex = firstRow.findIndex(value => /amount|paid.?in|credit/.test(value));
  const hasHeader = codeIndex >= 0 && amountIndex >= 0;
  const startAt = hasHeader ? 1 : 0;
  const parsedRows = [];
  for (let index = startAt; index < lines.length; index++) {
    const fields = splitStatementRow(lines[index], delimiter);
    const code = normalizeMpesaCode(fields[hasHeader ? codeIndex : 0]);
    const amount = parseStatementAmount(fields[hasHeader ? amountIndex : 1]);
    if (code.length < 8 || code.length > 12 || !Number.isFinite(amount) || amount <= 0) continue;
    const id = `statement:${code}:${Math.round(amount)}`;
    parsedRows.push({ id, code, amount, sourceLine: lines[index], importedAt: new Date() });
  }
  if (!parsedRows.length) {
    state.mpesaStatementError = "No valid rows found. Use columns for transaction code and amount.";
    render();
    return false;
  }
  const currentRows = new Map(state.mpesaStatementRows.map(row => [row.id, row]));
  parsedRows.forEach(row => { if (!currentRows.has(row.id)) currentRows.set(row.id, row); });
  state.mpesaStatementRows = [...currentRows.values()];
  state.mpesaStatementImportedAt = new Date();
  state.mpesaStatementError = "";

  const used = new Set(offlineMpesaSales().filter(sale => sale.reconciliationStatus === "matched").map(sale => sale.reconciliationStatementId));
  offlineMpesaSales().forEach(sale => {
    if (sale.reconciliationStatus === "matched") {
      state.mpesaSelectedStatements[sale.no] = sale.reconciliationStatementId;
      return;
    }
    const existingSelection = state.mpesaSelectedStatements[sale.no];
    if (existingSelection && state.mpesaStatementRows.some(row => row.id === existingSelection) && !used.has(existingSelection)) {
      used.add(existingSelection);
      return;
    }
    const match = state.mpesaStatementRows.find(row => row.code === normalizeMpesaCode(sale.ref) && !used.has(row.id));
    state.mpesaSelectedStatements[sale.no] = match?.id || "";
    if (match) used.add(match.id);
  });
  render();
  toast(`${parsedRows.length} statement row${parsedRows.length===1?"":"s"} imported`);
  return true;
}

function selectableStatementRows(sale) {
  const used = new Set(offlineMpesaSales().filter(item => item.no !== sale.no && item.reconciliationStatus === "matched").map(item => item.reconciliationStatementId));
  return state.mpesaStatementRows.filter(row => !used.has(row.id) || row.id === sale.reconciliationStatementId || row.id === state.mpesaSelectedStatements[sale.no]);
}

function selectMpesaStatement(saleNo, statementId) {
  state.mpesaSelectedStatements[saleNo] = statementId;
  render();
}

function setMpesaReconciliation(saleNo, status) {
  if (state.currentUser?.role !== "owner") return false;
  const sale = offlineMpesaSales().find(item => item.no === saleNo);
  if (!sale) return false;
  if (status === "matched") {
    const statementId = state.mpesaSelectedStatements[saleNo] || sale.reconciliationStatementId;
    const row = state.mpesaStatementRows.find(item => item.id === statementId);
    if (!row) {
      toast("Choose a statement row before matching");
      return false;
    }
    const usedByAnotherSale = offlineMpesaSales().some(item => item.no !== saleNo && item.reconciliationStatus === "matched" && item.reconciliationStatementId === row.id);
    if (usedByAnotherSale) {
      toast("That statement row is already matched to another sale");
      return false;
    }
    if (row.code !== normalizeMpesaCode(sale.ref) || Math.round(row.amount) !== Math.round(sale.t)) {
      toast("Code and amount must both match. Mark disputed if they differ.");
      return false;
    }
    sale.reconciliationStatus = "matched";
    sale.reconciliationStatementId = row.id;
    sale.reconciliationReason = "";
    state.mpesaDisputeReasons[saleNo] = "";
    sale.reconciledAt = new Date();
    sale.reconciledBy = state.currentUser.name;
    addAuditEntry("M-Pesa matched", `${sale.no} · ${row.code} · ${kes(row.amount)}`);
  } else if (status === "disputed") {
    sale.reconciliationStatus = "disputed";
    sale.reconciliationStatementId = state.mpesaSelectedStatements[saleNo] || "";
    sale.reconciliationReason = (state.mpesaDisputeReasons[saleNo] || "").trim() || "Owner review required";
    sale.reconciledAt = new Date();
    sale.reconciledBy = state.currentUser.name;
    addAuditEntry("M-Pesa disputed", `${sale.no} · ${sale.ref} · ${sale.reconciliationReason}`);
  } else {
    sale.reconciliationStatus = "pending";
    sale.reconciliationStatementId = "";
    sale.reconciliationReason = "";
    state.mpesaDisputeReasons[saleNo] = "";
    sale.reconciledAt = null;
    sale.reconciledBy = "";
    addAuditEntry("M-Pesa reopened", `${sale.no} · ${sale.ref}`);
  }
  render();
  return true;
}

function mpesaReconciliationView() {

        ${sale.reconciliationReason?`<small class="low">${esc(sale.reconciliationReason)}</small>`:`<small class="mu">${status==="matched"?`Matched by ${esc(sale.reconciledBy||"Owner")} · ${sale.reconciledAt?new Date(sale.reconciledAt).toLocaleString("en-KE"):""}`:"Select a statement row to compare code and amount."}</small>`}
        <label class="fl">Statement entry<select aria-label="Statement entry for ${esc(sale.no)}" ${status==="matched"?"disabled":""} onchange="selectMpesaStatement('${esc(sale.no)}',this.value)"><option value="">Choose a pasted row</option>${options.map(option=>`<option value="${esc(option.id)}" ${selectedId===option.id?"selected":""}>${esc(option.code)} · ${kes(option.amount)}</option>`).join("")}</select></label>
        ${row?`<div class="mpesa-match-hint ${codeMatches&&amountMatches?"ok":"low"}">Code ${codeMatches?"matches":"differs"} · Amount ${amountMatches?"matches":"differs"}</div>`:""}
        <label class="fl">Dispute note <input value="${esc(state.mpesaDisputeReasons[sale.no]||sale.reconciliationReason||"")}" placeholder="Optional reason for dispute" oninput="state.mpesaDisputeReasons['${esc(sale.no)}']=this.value"></label>
      </div>

    </article>`;

  return `<div class="offline-screen reconcile-screen">

    <div class="report-note">Paste rows with transaction code and amount. Accepted layout: <b>Code, Amount, Phone, Date</b> (CSV, tab-delimited or semicolon-delimited).</div>
    <section class="card statement-import"><div class="offline-section-head"><div><h3>Mock statement</h3><small class="mu">${state.mpesaStatementRows.length} imported row${state.mpesaStatementRows.length===1?"":"s"}${state.mpesaStatementImportedAt?` · last pasted ${state.mpesaStatementImportedAt.toLocaleString("en-KE")}`:""}</small></div></div><textarea aria-label="Paste M-Pesa statement" placeholder="Code,Amount,Phone,Date\nQX7AB12C,1200,0712345678,2026-10-18" oninput="state.mpesaStatementInput=this.value">${esc(state.mpesaStatementInput)}</textarea>${state.mpesaStatementError?`<p class="login-error" role="alert">${esc(state.mpesaStatementError)}</p>`:""}<div class="offline-actions"><button class="pri" onclick="importMpesaStatement()">Import statement rows</button><button onclick="state.mpesaStatementInput='';state.mpesaStatementError='';render()">Clear text</button></div></section>
    <section class="card"><div class="offline-section-head"><div><h3>Offline M-Pesa sales</h3><small class="mu">${pendingMpesaReconciliationCount()} pending · ${sales.filter(sale=>sale.reconciliationStatus==="matched").length} matched · ${sales.filter(sale=>sale.reconciliationStatus==="disputed").length} disputed</small></div></div>${sales.length?`<div class="mpesa-reconcile-list">${sales.map(saleRow).join("")}</div>`:emptyState("No offline M-Pesa sales yet.","Take an M-Pesa payment while offline and enter its confirmation code here.")}</section>
    <section class="card"><h3>Pasted statement rows</h3><div class="report-table-wrap"><table class="report-table"><thead><tr><th>Transaction code</th><th class="num">Amount</th><th>Match status</th></tr></thead><tbody>${state.mpesaStatementRows.map(row=>{const used=usedRows.get(row.id);return `<tr><td>${esc(row.code)}</td><td class="num">${kes(row.amount)}</td><td>${used?`${used.reconciliationStatus==="disputed"?"Disputed on":"Matched to"} ${esc(used.no)}`:"Available"}</td></tr>`;}).join("")||`<tr><td colspan="3" class="report-empty">No statement rows imported.</td></tr>`}</tbody></table></div></section>

function tTheme() {
  const d = document.documentElement;
  const cur = d.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  d.dataset.theme = cur == "dark" ? "light" : "dark";
}

function toast(m, kind = "") {
  const message = String(m);
  const inferred = /\b(saved|posted|received|held|prepared|copied|downloaded|synced|imported|voided|matched|reconciled|simulated|scanned|approved|opened|closed|created|updated|added|completed|printed)\b/i.test(message) ? "success" : /^(Enter |Invalid |Cannot |No |Item is out|Sale blocked|Stock movement blocked|Adjustment blocked|Owner access required|Choose a |That statement|Code and amount|Finish or cancel|A reason is required|A cashier discount)/i.test(message) ? "error" : "info";
  const type = kind || inferred;
  const icon = type === "success" ? IC.ok : type === "error" ? IC.warning : IC.info;
  $("tt").innerHTML = `<div class="toast toast-${type}" role="${type === "error" ? "alert" : "status"}" aria-live="${type === "error" ? "assertive" : "polite"}"><span class="toast-icon" aria-hidden="true">${icon}</span><span>${esc(message)}</span></div>`;
  setTimeout(() => $("tt").innerHTML = "", 2200);
}

function add(id) {
  const p = state.products.find(x => x.id === id);
  if (!p || (state.zeroStockPolicy === "block" && getProductBaseUnits(id) <= 0)) {
    toast("Item is out of stock");
    return false;
  }
  const currentInCartBase = state.cart
    .filter(x => x.id === id)
    .reduce((sum, x) => sum + toBaseUnits(p, x.u, x.q), 0);
  const addBase = toBaseUnits(p, "b", 1);
  if (state.zeroStockPolicy === "block" && currentInCartBase + addBase > getProductBaseUnits(id)) {
    toast("Cannot add: exceeds available stock");
    return false;
  }
  const l = state.cart.find(x => x.id == id && x.u == "b" && !(Number(x.discountPercent) > 0));
  l ? l.q++ : state.cart.push({ id, u: "b", q: 1, discountPercent: 0 });
  render();
  return true;
}

function qty(i, d) {
  const l = state.cart[i];
  if (!l) return false;
  const p = state.products.find(x => x.id === l.id);
  if (d > 0) {
    const currentInCartBase = state.cart
      .filter(x => x.id === l.id)
      .reduce((sum, x) => sum + toBaseUnits(p, x.u, x.q), 0);
    const addBase = toBaseUnits(p, l.u, d);
    if (state.zeroStockPolicy === "block" && currentInCartBase + addBase > getProductBaseUnits(l.id)) {
      toast("Cannot add: exceeds available stock");
      return false;
    }
  }
  l.q += d;
  if (l.q < 1) state.cart.splice(i, 1);
  if (!state.cart.length) {
    state.cartDiscountPercent = 0;
    state.ageVerified = false;
    state.cartOpen = false;
  }
  render();
  return true;
}

function unit(i, u) {
  const l = state.cart[i];
  if (!l) return false;
  const p = state.products.find(x => x.id === l.id);
  const otherLinesBase = state.cart
    .filter((x, idx) => idx !== i && x.id === l.id)
    .reduce((sum, x) => sum + toBaseUnits(p, x.u, x.q), 0);
  const newBase = toBaseUnits(p, u, l.q);
  if (state.zeroStockPolicy === "block" && otherLinesBase + newBase > getProductBaseUnits(l.id)) {
    toast("Cannot switch unit: exceeds available stock");
    return false;
  }
  l.u = u;
  const j = state.cart.findIndex((x, k) => k != i && x.id == l.id && x.u == u);
  if (j > -1) {
    const target = state.cart[j];
    target.discountPercent = ((target.discountPercent || 0) * target.q + (l.discountPercent || 0) * l.q) / (target.q + l.q);
    state.cart[j].q += l.q;
    state.cart.splice(i, 1);
  }
  render();
  return true;
}

function keep(id) {
  if (!id) return;
  const e = $(id);
  if (e) {
    e.focus();
    e.setSelectionRange(e.value.length, e.value.length);
  }
}

function search(v) {
  state.searchQuery = v;
  render();
  keep("q");
}

function scan(e) {
  if (e.key != "Enter") return;
  const f = list();
  if (f.length) {
    add(f[0].id);
    state.searchQuery = "";
    render();
    keep("q");
  }
}

function simulateScan() {
  const pool = state.products.filter(product => state.zeroStockPolicy !== "block" || getProductBaseUnits(product.id) > 0);
  if (!pool.length) {
    toast("No products available to scan");
    return false;
  }
  const product = pool[Math.floor(Math.random() * pool.length)];
  state.searchQuery = "";
  const added = add(product.id);
  if (added) toast(`Scanned · ${product.n}`);
  return added;
}

function reprintLastSale() {
  const sale = [...state.sales].reverse().find(item => item.tillNumber === state.till.tillNumber);
  if (!sale) {
    toast("No sale to reprint");
    return false;
  }
  state.receipt = sale;
  state.receiptMode = "reprint";
  render();
  return true;
}
function closeReceipt() {
  state.receipt = null;
  state.receiptMode = "sale";
  render();
}

function upd(k, v, id) {
  state.payment[k] = v;
  render();
  keep(id);
}

function list() {
  const q = state.searchQuery.toLowerCase();
  return state.products.filter(p => (state.selectedCategory == "All" || p.g == state.selectedCategory) && (p.n + p.s).toLowerCase().includes(q));
}

const CASH_DENOMINATIONS = [1000, 500, 200, 100, 50, 40, 20, 10, 5, 1];
function activeShiftSales() {
  return state.sales.slice(state.till.salesStartIndex || 0).filter(s => !s.voided);
}
function shiftExpectedCash() {
  return state.till.openingFloat + activeShiftSales().filter(s => s.m === "cash").reduce((sum, s) => sum + s.t, 0);
}
function shiftExpectedMpesa() {
  return activeShiftSales().filter(s => s.m === "mpesa").reduce((sum, s) => sum + s.t, 0);
}
function beginTillOpen() {
  if (state.till.status === "open") return false;
  state.tillFlow = "open";
  state.tillDraft = { float: state.till.float || 0 };
  render();
  return true;
}
function beginTillClose() {
  if (state.till.status !== "open") return false;
  if (state.payment) {
    toast("Finish or cancel the payment before closing the till");
    return false;
  }
  state.tillFlow = "close";
  state.tillDraft = {
    denominations: Object.fromEntries(CASH_DENOMINATIONS.map(value => [value, 0])),
    mpesaReceived: "",
    reason: "",
    ownerPin: ""
  };
  render();
  return true;
}
function updateTillDraft(field, value) {
  if (!state.tillDraft) return;
  state.tillDraft[field] = value;
  updateTillCloseTotals();
}
function updateTillDenomination(value, count) {
  if (!state.tillDraft || !state.tillDraft.denominations) return;
  state.tillDraft.denominations[value] = count;
  updateTillCloseTotals();
}
function tillCloseTotals() {
  const draft = state.tillDraft || {};
  const cashCounted = Object.entries(draft.denominations || {}).reduce((sum, [value, count]) => sum + Number(value) * Number(count || 0), 0);
  const cashExpected = shiftExpectedCash();
  const mpesaExpected = shiftExpectedMpesa();
  const mpesaReceived = Number(draft.mpesaReceived || 0);
  const cashVariance = cashCounted - cashExpected;
  const mpesaVariance = mpesaReceived - mpesaExpected;
  return { cashCounted, cashExpected, cashVariance, mpesaExpected, mpesaReceived, mpesaVariance, totalVariance: cashVariance + mpesaVariance };
}
function updateTillCloseTotals() {
  if (state.tillFlow !== "close") return;
  const totals = tillCloseTotals();
  const values = {
    "counted-cash": kes(totals.cashCounted),
    "cash-variance": kes(totals.cashVariance),
    "mpesa-variance": kes(totals.mpesaVariance),
    "total-variance": kes(totals.totalVariance)
  };
  Object.entries(values).forEach(([id, value]) => {
    const element = $(id);
    if (element) element.textContent = value;
  });
}
function cancelTillFlow() {
  state.tillFlow = null;
  state.tillDraft = null;
  render();
}
function submitTillOpen() {
  const openingFloat = Number(state.tillDraft?.float);
  if (!Number.isFinite(openingFloat) || openingFloat < 0) {
    toast("Enter a valid opening float");
    return false;
  }
  state.till.status = "open";
  state.till.float = Math.round(openingFloat);
  state.till.openingFloat = Math.round(openingFloat);
  state.till.openedAt = new Date();
  state.till.salesStartIndex = state.sales.length;
  addAuditEntry("Till opened", `Till ${state.till.tillNumber} · float ${kes(state.till.openingFloat)}`);
  state.tillFlow = null;
  state.tillDraft = null;
  render();
  return true;
}
function submitTillClose() {
  if (state.till.status !== "open" || !state.tillDraft) return false;
  for (const [denomination, count] of Object.entries(state.tillDraft.denominations)) {
    if (!Number.isInteger(Number(count)) || Number(count) < 0) {
      toast(`Enter a whole, non-negative count for KES ${denomination}`);
      return false;
    }
  }
  if (state.tillDraft.mpesaReceived === "" || !Number.isFinite(Number(state.tillDraft.mpesaReceived)) || Number(state.tillDraft.mpesaReceived) < 0) {
    toast("Enter the M-Pesa amount received");
    return false;
  }
  const totals = tillCloseTotals();
  const hasVariance = totals.cashVariance !== 0 || totals.mpesaVariance !== 0;
  if (hasVariance && !state.tillDraft.reason.trim()) {
    toast("Add a reason for the cash or M-Pesa variance");
    return false;
  }
  if (state.tillDraft.ownerPin !== "1234") {
    toast("Owner sign-off requires the correct PIN");
    return false;
  }
  const closedAt = new Date();
  const summary = {
    id: `SHIFT-${String(state.shiftHistory.length + 1).padStart(4, "0")}`,
    tillNumber: state.till.tillNumber,
    cashier: state.till.cashier,
    owner: "Owner",
    openedAt: state.till.openedAt,
    closedAt,
    openingFloat: state.till.openingFloat,
    transactionCount: activeShiftSales().length,
    cashSales: totals.cashExpected - state.till.openingFloat,
    denominations: { ...state.tillDraft.denominations },
    ...totals,
    reason: state.tillDraft.reason.trim(),
    signedOffBy: "Owner",
    ownerSignedOff: true
  };
  state.shiftHistory.push(summary);
  addAuditEntry("Till closed", `${summary.id} · variance ${kes(summary.totalVariance)} · owner sign-off by ${summary.signedOffBy}`);
  state.till.status = "closed";
  state.till.closedAt = closedAt;
  state.shiftReceipt = summary;
  state.tillFlow = null;
  state.tillDraft = null;
  render();
  return true;
}

function charge() {
  if (state.till.status !== "open") {
    toast("Sale blocked: open the till before charging");
    return false;
  }
  if (!state.cart.length || (state.shopSettings.agePromptEnabled && !state.ageVerified)) {
    toast(state.cart.length ? "Confirm the 18+ age check before charging" : "Add items before charging");
    return false;
  }
  if (outsideTradingHours()) toast(`Trading hours reminder · ${state.shopSettings.openingTime}–${state.shopSettings.closingTime}`);
  state.payment = { m: "cash", tend: total(), phone: "0712 345 678", ref: "", st: "idle" };
  render();
  return true;
}

function stk() {
  if (!String(state.payment?.phone || "").trim()) {
    toast("Enter the customer phone number first");
    return false;
  }
  state.payment.st = "wait";
  render();
  setTimeout(() => {
    if (state.payment) {
      state.payment.st = "ok";
      state.payment.ref = "S" + Math.random().toString(36).slice(2, 11).toUpperCase();

function finish() {
  if (state.till.status !== "open") {
    state.payment = null;
    toast("Sale blocked: open the till before charging");
    render();
    return false;
  }
  const t = total();
  const d = state.payment;
  if (!d) {
    toast("Start checkout before completing the sale");
    return false;
  }
  if (d.m === "mpesa" && !String(d.phone || "").trim()) {
    toast("Enter the customer phone number for the M-Pesa receipt");
    return false;
  }
  const subtotal = cartSubtotal();

  // Validate all lines to ensure negative stock is blocked
  for (const l of state.cart) {
    const p = state.products.find(x => x.id === l.id);
    const currentCartBase = state.cart
      .filter(x => x.id === l.id)
      .reduce((sum, x) => sum + toBaseUnits(p, x.u, x.q), 0);
    if (state.zeroStockPolicy === "block" && currentCartBase > getProductBaseUnits(p.id)) {
      toast("Sale blocked: exceeds available stock for " + p.n);
      return false;
    }
  }

  const s = {
    no: "INV-" + String(++state.invoiceSeq).padStart(6, "0"),
    lines: state.cart.map(l => {
      const p = state.products.find(x => x.id === l.id);
      const gross = price(p, l.u) * l.q;
      const lineDiscount = gross - Math.round(gross * (1 - (Number(l.discountPercent) || 0) / 100));
      return { productId: p.id, category: p.g, n: p.n, s: p.s, u: l.u, q: l.q, pr: price(p, l.u), discountPercent: Number(l.discountPercent) || 0, gross, lineDiscount, net: gross - lineDiscount };
    }),
    subtotal,
    lineDiscountAmount: subtotal - cartAfterLineDiscounts(),
    discountPercent: state.cartDiscountPercent,
    billDiscountAmount: cartDiscountAmount(),
    discountAmount: subtotal - t,
    t,
    m: d.m,
    ref: d.ref,
    tend: d.tend,
    phone: d.m === "mpesa" ? String(d.phone || "").trim() : "",
    receiptSettings: { ...state.shopSettings },
    pend: d.m == "mpesa" && state.offline,
    user: currentActor(),
    tillNumber: state.till.tillNumber,
    voided: false,
    syncTracked: state.offline,
    syncStatus: state.offline ? "pending" : "synced",
    syncAttempts: 0,
    reconciliationStatus: d.m === "mpesa" && state.offline ? "pending" : "not-required",
    reconciliationStatementId: "",
    reconciliationReason: "",
    at: new Date()
  };

  // Append-only stock movements ledger derivation (recording movements safely)
  for (const l of state.cart) {
    const p = state.products.find(x => x.id === l.id);
    const baseDelta = toBaseUnits(p, l.u, l.q);
    const ok = recordStockMovement({
      id: "mov_" + (++state.movementSeq),
      productId: p.id,
      type: "sale",
      qty: -baseDelta,
      negativeStock: getProductBaseUnits(p.id) - baseDelta < 0,
      unit: l.u,
      unitQty: l.q,
      ref: s.no,
      note: `Sale ${s.no} (${l.q} ${U[l.u]})${getProductBaseUnits(p.id) - baseDelta < 0 ? " · NEGATIVE STOCK" : ""}`,
      user: currentActor(),
      at: new Date()
    });
    if (!ok) {
      toast("Stock movement blocked: would result in negative stock");
      return false;
    }
  }

  state.sales.push(s);
  addAuditEntry("Sale", `${s.no} · ${kes(s.t)} · ${s.m === "cash" ? "Cash" : "M-Pesa"}`);
  state.receipt = s;
  state.receiptMode = "sale";
  state.payment = null;
  state.cart = [];
  state.cartDiscountPercent = 0;
  state.ageVerified = false;
  render();
  return true;
}

function requestLineVoid(index) {
  const line = state.cart[index];
  if (!line) return false;
  const p = state.products.find(product => product.id === line.id);
  const details = `${line.q} ${U[line.u]} ${p?.n || "item"} removed from current sale`;
  requestOwnerApproval("Void line", details, () => {
    const current = state.cart[index];
    if (!current || current.id !== line.id || current.u !== line.u) return;
    state.cart.splice(index, 1);
    if (!state.cart.length) {
      state.cartDiscountPercent = 0;
      state.ageVerified = false;
      state.cartOpen = false;
    }
    render();
    toast("Line voided");
  });
  return true;
}

function requestSaleVoid(saleNo = state.receipt?.no) {
  const sale = state.sales.find(candidate => candidate.no === saleNo);
  if (!sale || sale.voided) return false;
  requestOwnerApproval("Void sale", `${sale.no} · ${kes(sale.t)} · ${sale.lines.map(line => line.n).join(", ")}`, ({ requestedBy, reason, owner }) => {
    if (sale.voided) return;
    for (const line of sale.lines) {
      const product = state.products.find(candidate => candidate.id === line.productId) || state.products.find(candidate => candidate.n === line.n);
      if (!product) continue;
      recordStockMovement({
        id: "mov_" + (++state.movementSeq), productId: product.id, type: "void",
        qty: toBaseUnits(product, line.u, line.q), unit: line.u, unitQty: line.q,
        ref: sale.no, note: `Voided sale ${sale.no} · ${reason}`, user: requestedBy, at: new Date()
      });
    }
    sale.voided = true;
    sale.voidedAt = new Date();
    sale.voidedBy = owner.name;
    sale.voidRequestedBy = requestedBy;
    sale.voidReason = reason;
    if (state.offline) {
      sale.syncTracked = true;
      sale.syncStatus = "pending";
      sale.syncAttempts = 0;
      sale.syncQueuedAt = new Date();
    }
    state.receipt = sale;
    render();
    toast(`${sale.no} voided · stock restored`);
  });
  return true;
}

const REPORT_PRESETS = [
  { id: "today", label: "Today" },
  { id: "7d", label: "7 days" },
  { id: "30d", label: "30 days" },
  { id: "90d", label: "90 days" },
  { id: "all", label: "All time" }
];

function reportBounds(preset = state.reportPreset) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const days = { today: 1, "7d": 7, "30d": 30, "90d": 90 }[preset];
  if (!days) return { start: "", end: localDateKey(today) };
  const start = new Date(today);
  start.setDate(start.getDate() - days + 1);
  return { start: localDateKey(start), end: localDateKey(today) };
}

function isInReportRange(date, preset = state.reportPreset) {
  const key = localDateKey(date);
  const { start, end } = reportBounds(preset);
  return (!start || key >= start) && key <= end;
}

function reportSales(includeVoided = false) {
  return state.sales.filter(sale => (includeVoided || !sale.voided) && isInReportRange(sale.at));
}

function reportProductForLine(line) {
  return state.products.find(product => product.id === line.productId) || state.products.find(product => product.n === line.n) || null;
}

function reportBottleQuantity(line) {
  const product = reportProductForLine(line);
  return product ? toBaseUnits(product, line.u, Number(line.q) || 0) / (product.baseUnitsPerBottle || 1) : Number(line.q) || 0;
}

function reportLineNet(line) {
  const gross = Number(line.gross ?? ((Number(line.pr) || 0) * (Number(line.q) || 0)));
  return Math.max(0, gross - (Number(line.lineDiscount) || 0));
}

function reportLineRevenue(sale, line) {
  const lineNetValue = reportLineNet(line);
  const totalLineNet = sale.lines.reduce((sum, item) => sum + reportLineNet(item), 0);
  const billDiscount = Number(sale.billDiscountAmount) || 0;
  return totalLineNet ? Math.max(0, lineNetValue - billDiscount * lineNetValue / totalLineNet) : 0;
}

function reportItemTotals(sales = reportSales()) {
  const byProduct = new Map();
  sales.forEach(sale => sale.lines.forEach(line => {
    const product = reportProductForLine(line);
    const key = product ? product.id : line.n;
    const entry = byProduct.get(key) || { id: product?.id, name: product?.n || line.n, category: line.category || product?.g || "Other", bottles: 0, revenue: 0, estimatedMargin: 0 };
    const bottles = reportBottleQuantity(line);
    const revenue = reportLineRevenue(sale, line);
    entry.bottles += bottles;
    entry.revenue += revenue;
    entry.estimatedMargin += revenue - bottles * (product ? product.buyPrice : 0);
    byProduct.set(key, entry);
  }));
  return [...byProduct.values()];
}

function dailySalesData(sales = reportSales()) {
  const byDate = new Map();
  sales.forEach(sale => {
    const key = localDateKey(sale.at);
    byDate.set(key, (byDate.get(key) || 0) + (Number(sale.t) || 0));
  });
  const { start, end } = reportBounds();
  if (!start) return [...byDate.entries()].sort((a, b) => a[0].localeCompare(b[0])).slice(-60).map(([date, amount]) => ({ date, amount }));
  const rows = [];
  const date = new Date(`${start}T00:00:00`);
  const last = new Date(`${end}T00:00:00`);
  while (date <= last) {
    const key = localDateKey(date);
    rows.push({ date: key, amount: byDate.get(key) || 0 });
    date.setDate(date.getDate() + 1);
  }
  return rows;
}

function salesChartMarkup(rows) {
  if (!rows.length || !rows.some(row => row.amount > 0)) return emptyState("No completed sales in this period.", "Completed receipts will appear here.");
  const width = 720, height = 230, left = 48, right = 12, top = 14, bottom = 38;
  const chartWidth = width - left - right, chartHeight = height - top - bottom;
  const max = Math.max(...rows.map(row => row.amount), 1);
  const step = chartWidth / rows.length;
  const barWidth = Math.max(3, Math.min(30, step * .62));
  const ticks = 4;
  const grid = Array.from({ length: ticks + 1 }, (_, index) => {
    const value = max * (ticks - index) / ticks;
    const y = top + chartHeight * index / ticks;
    return `<line x1="${left}" y1="${y}" x2="${width-right}" y2="${y}" stroke="var(--bd)" stroke-width="1"/><text x="${left-8}" y="${y+4}" text-anchor="end">${Math.round(value).toLocaleString("en-KE")}</text>`;
  }).join("");
  const bars = rows.map((row, index) => {
    const barHeight = row.amount ? Math.max(1, row.amount / max * chartHeight) : 0;
    const x = left + index * step + (step - barWidth) / 2;
    const y = top + chartHeight - barHeight;
    return `<rect x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="3" fill="var(--ac)"><title>${esc(row.date)} · ${esc(kes(row.amount))}</title></rect>`;
  }).join("");
  const labelEvery = Math.max(1, Math.ceil(rows.length / 7));
  const labels = rows.map((row, index) => index % labelEvery === 0 || index === rows.length - 1 ? `<text x="${left+index*step+step/2}" y="${height-10}" text-anchor="middle">${esc(row.date.slice(5))}</text>` : "").join("");
  return `<div class="chart-scroll"><svg class="sales-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Sales by day chart">${grid}${bars}${labels}</svg></div>`;
}

function metricBarsMarkup(items, amountKey, labelKey, valueLabel) {
  if (!items.length || !items.some(item => item[amountKey] > 0)) return emptyState("No recorded activity in this period.", "Activity will appear here as the shop makes sales.");
  const max = Math.max(...items.map(item => item[amountKey]), 1);
  return `<div class="metric-bars">${items.map(item => `<div class="metric-bar"><span title="${esc(item[labelKey])}">${esc(item[labelKey])}</span><span class="metric-bar-track"><i style="width:${Math.max(2, item[amountKey]/max*100)}%"></i></span><b>${esc(valueLabel(item[amountKey]))}</b></div>`).join("")}</div>`;
}

function reportMarginRows(sales = reportSales()) {
  const actual = new Map(reportItemTotals(sales).map(item => [item.id ?? item.name, item]));
  return state.products.map(product => {
    const item = actual.get(product.id) || { bottles: 0, revenue: 0, estimatedMargin: 0 };
    const unitMargin = product.b - product.buyPrice;
    const marginPct = product.b ? unitMargin / product.b * 100 : 0;
    return { product, bottles: item.bottles, revenue: item.revenue, estimatedMargin: item.estimatedMargin, unitMargin, marginPct };
  }).sort((a, b) => b.unitMargin - a.unitMargin);
}

function reportShrinkageRows() {
  return state.stockMovements.filter(movement => movement.type === "take" && isInReportRange(movement.at)).map(movement => {
    const product = state.products.find(item => item.id === movement.productId);
    const bottles = product ? movement.qty / (product.baseUnitsPerBottle || 1) : movement.qty;
    return { movement, product, bottles, value: Math.abs(bottles) * (product?.buyPrice || 0) };
  }).sort((a, b) => new Date(b.movement.at) - new Date(a.movement.at));
}

function reportEventRows() {
  return state.auditLog.filter(entry => ["Void sale", "Void line", "Discount"].includes(entry.action) && isInReportRange(entry.at)).slice().sort((a, b) => new Date(b.at) - new Date(a.at));
}

}

function reorderSuggestions() {
  const windowStart = new Date();
  windowStart.setHours(0, 0, 0, 0);
  windowStart.setDate(windowStart.getDate() - 29);
  const from = localDateKey(windowStart);
  const units = new Map();
  state.sales.filter(sale => !sale.voided && localDateKey(sale.at) >= from).forEach(sale => sale.lines.forEach(line => {
    const product = reportProductForLine(line);
    if (product) units.set(product.id, (units.get(product.id) || 0) + reportBottleQuantity(line));
  }));
  return state.products.map(product => {
    const sold = units.get(product.id) || 0;
    const dailyVelocity = sold / 30;
    const minimum = reorderThreshold(product);
    const target = Math.max(minimum, minimum + dailyVelocity * 14);
    const needBottles = Math.max(0, target - product.st);
    const cartons = needBottles > 0 ? Math.ceil(needBottles / product.k) : 0;
    return { product, supplier: product.preferredSupplier || state.suppliers[0], sold, dailyVelocity, target, needBottles, cartons };
  }).filter(item => item.cartons > 0).sort((a,b) => a.supplier.localeCompare(b.supplier) || b.needBottles-a.needBottles);
}

function reorderSupplierNames() {
  return [...new Set([...state.suppliers, ...state.products.map(product => product.preferredSupplier).filter(Boolean)])];
}

function ensureReorderSupplier() {
  const names = reorderSupplierNames();
  if (!names.includes(state.reorderSupplier)) {
    const firstSuggested = reorderSuggestions()[0]?.supplier;
    state.reorderSupplier = firstSuggested || names[0] || "Supplier";
  }
  return state.reorderSupplier;
}

function reorderLinesForSupplier(supplier = ensureReorderSupplier()) {
  const suggestions = reorderSuggestions().filter(item => item.supplier === supplier);
  const draft = state.purchaseDrafts[supplier];
  return suggestions.map(item => {
    const saved = draft?.items?.find(line => line.productId === item.product.id);
    return { ...item, cartons: saved ? saved.cartons : item.cartons };
  });
}

function setReportPreset(preset) {
  if (!REPORT_PRESETS.some(item => item.id === preset)) return;
  state.reportPreset = preset;
  render();
}

function setReportTab(tab) {
  state.reportTab = tab === "reorder" ? "reorder" : "reports";
  render();
}

function selectReorderSupplier(supplier) {
  state.reorderSupplier = supplier;
  render();
}

function updatePurchaseDraftQty(supplier, productId, rawValue) {
  const value = Math.max(0, Math.floor(Number(rawValue) || 0));
  const draft = state.purchaseDrafts[supplier] || { id: "", supplier, items: reorderSuggestions().filter(item => item.supplier === supplier).map(item => ({ productId: item.product.id, cartons: item.cartons })) };
  const existing = draft.items.find(item => item.productId === productId);
  if (existing) existing.cartons = value;
  else draft.items.push({ productId, cartons: value });
  state.purchaseDrafts[supplier] = draft;
  render();
}

function buildPurchaseDraft(supplier = ensureReorderSupplier()) {
  const existing = state.purchaseDrafts[supplier] || { id: "", items: [] };
  const currentLines = reorderLinesForSupplier(supplier);
  const lines = currentLines.map(line => ({ productId: line.product.id, cartons: line.cartons }));
  if (!lines.some(line => line.cartons > 0)) {
    toast("Set at least one carton quantity before building a purchase order");
    return false;
  }
  const id = existing.id || `DPO-${String(++state.purchaseDraftSeq).padStart(4,"0")}`;
  state.purchaseDrafts[supplier] = { id, supplier, items: lines, createdAt: existing.createdAt || new Date(), updatedAt: new Date() };
  render();
  toast(`${id} draft prepared for ${supplier}`);
  return true;
}

function purchaseDraftTotal(supplier) {
  return reorderLinesForSupplier(supplier).reduce((sum, line) => sum + line.cartons * line.product.k * line.product.buyPrice, 0);
}

function whatsappMessage(supplier) {
  const draft = state.purchaseDrafts[supplier];
  if (!draft) return "";
  const lines = reorderLinesForSupplier(supplier).filter(line => line.cartons > 0);
  return [`Hi ${supplier},`, "", `Please prepare draft order ${draft.id} for Cellar & Co.:`, ...lines.map(line => `• ${line.product.n} — ${line.cartons} carton${line.cartons===1?"":"s"} (${line.cartons*line.product.k} bottles)`), "", `Estimated total: ${kes(purchaseDraftTotal(supplier))}`, "Please confirm availability and delivery timing. Thank you."].join("\n");
}

function openWhatsAppPreview(supplier = ensureReorderSupplier()) {
  if (!state.purchaseDrafts[supplier]?.id) {
    toast("Build the draft purchase order first");
    return false;
  }
  state.whatsappPreviewSupplier = supplier;
  render();
  return true;
}

function closeWhatsAppPreview() {
  state.whatsappPreviewSupplier = "";
  render();
}

function copyWhatsAppPreview() {
  const text = whatsappMessage(state.whatsappPreviewSupplier);
  if (!text) return false;
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(() => toast("Order message copied")).catch(() => toast("Select and copy the message preview"));
  } else {
    $("whatsapp-message")?.select();
    toast("Select and copy the message preview");
  }
  return true;
}

function downloadCsv(filename, headers, rows) {
  const escapeCsv = value => `"${String(value ?? "").replace(/"/g, '""')}"`;
  const csv = [headers, ...rows].map(row => row.map(escapeCsv).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF", csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`${filename} downloaded · demo CSV`);
}

function exportReportCsv() {
  const sales = reportSales();
  const rows = [];
  sales.forEach(sale => rows.push(["Sale", localDateKey(sale.at), sale.no, "Receipt total", "", "", sale.t, `${sale.m === "cash" ? "Cash" : "M-Pesa"}${sale.pend ? " · pending" : ""}`]));
  sales.filter(sale => sale.discountAmount > 0).forEach(sale => rows.push(["Discount", localDateKey(sale.at), sale.no, "Total discount", "", "", sale.discountAmount, `${sale.discountPercent || 0}% bill discount plus line discounts`]));
  const methodTotals = ["cash", "mpesa"].map(method => [method, sales.filter(sale => sale.m === method).reduce((sum, sale) => sum + sale.t, 0)]);
  methodTotals.forEach(([method, amount]) => rows.push(["Payment method", "", "", method === "cash" ? "Cash" : "M-Pesa", "", "", amount, ""]));
  const categories = new Map();
  sales.forEach(sale => sale.lines.forEach(line => {
    const category = line.category || reportProductForLine(line)?.g || "Other";
    categories.set(category, (categories.get(category) || 0) + reportLineRevenue(sale,line));
  }));
  categories.forEach((amount, category) => rows.push(["Category", "", "", category, category, "", amount, ""]));
  reportItemTotals(sales).forEach(item => rows.push(["Seller", "", "", item.name, item.category, fs(item.bottles), item.revenue, "Bottle equivalent"]));
  reportMarginRows(sales).forEach(item => rows.push(["Margin", "", "", item.product.n, item.product.g, fs(item.bottles), item.bottles ? item.estimatedMargin : item.unitMargin, item.bottles ? "Estimated realized margin" : "List margin per bottle"]));
  reportShrinkageRows().forEach(item => rows.push(["Stock-take variance", localDateKey(item.movement.at), item.movement.ref, item.product?.n || "Product", "", fs(item.bottles), item.bottles < 0 ? -item.value : item.value, item.movement.note || ""]));
  reportEventRows().forEach(entry => rows.push([entry.action, localDateKey(entry.at), "", entry.details, "", "", "", entry.user]));
  downloadCsv(`cellar-report-${state.reportPreset}-${localDateKey(new Date())}.csv`, ["Section","Date","Reference","Product / detail","Category","Quantity","Amount (KES)","Notes"], rows);
}

function exportReorderCsv() {
  const rows = reorderSuggestions().map(item => [item.supplier, item.product.n, fs(item.product.st), fs(item.sold), item.dailyVelocity.toFixed(2), item.cartons, item.cartons*item.product.k, item.cartons*item.product.k*item.product.buyPrice]);
  downloadCsv(`cellar-reorder-list-${localDateKey(new Date())}.csv`, ["Supplier","Product","On hand (btl)","Sold last 30 days (btl eq.)","Daily velocity","Suggested cartons","Order bottles","Estimated cost (KES)"], rows);
}

function exportPurchaseDraftCsv(supplier = ensureReorderSupplier()) {
  const draft = state.purchaseDrafts[supplier];
  if (!draft?.id) return false;
  const rows = reorderLinesForSupplier(supplier).filter(line => line.cartons > 0).map(line => [draft.id, supplier, line.product.n, line.cartons, line.cartons*line.product.k, line.product.buyPrice, line.cartons*line.product.k*line.product.buyPrice]);
  downloadCsv(`${draft.id.toLowerCase()}-draft.csv`, ["Draft PO","Supplier","Product","Cartons","Bottles","Cost per bottle (KES)","Estimated line cost (KES)"], rows);
  return true;
}

function dash() {

function setStockTab(t) {

}

function setStockFilter(f) {

  render();
}

function searchStock(q) {

  render();
