<style>
:root{--rs:8px;--rm:12px;--rl:16px;--bg:#f5f4f2;--card:#fff;--tile:#faf9f8;--bd:#e6e3df;--tx:#19171c;--mu:#6c6872;--ac:#8a1c3c;--act:#8a1c3c;--onac:#fff;--acs:rgba(138,28,60,.07);--gd:#b8893a;--ok:#1d7a4b;--wn:#c0392b;--wns:rgba(192,57,43,.09);--sh:0 1px 2px rgba(25,23,28,.05),0 6px 20px rgba(25,23,28,.05);--ov:rgba(25,23,28,.4);--ph1:#efe9e4;--ph2:#e2d9d1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0f;--card:#14141a;--tile:#1a1a21;--bd:#262630;--tx:#f2f0f4;--mu:#9a96a4;--ac:#b8294f;--act:#f08aa4;--acs:rgba(240,138,164,.1);--gd:#d6b06a;--ok:#4fc58a;--wn:#f07a6a;--wns:rgba(240,122,106,.12);--sh:0 12px 32px rgba(0,0,0,.45);--ov:rgba(0,0,0,.65);--ph1:#23232c;--ph2:#191920;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0f;--card:#14141a;--tile:#1a1a21;--bd:#262630;--tx:#f2f0f4;--mu:#9a96a4;--ac:#b8294f;--act:#f08aa4;--acs:rgba(240,138,164,.1);--gd:#d6b06a;--ok:#4fc58a;--wn:#f07a6a;--wns:rgba(240,122,106,.12);--sh:0 12px 32px rgba(0,0,0,.45);--ov:rgba(0,0,0,.65);--ph1:#23232c;--ph2:#191920;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:15px}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:1rem/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;background-image:radial-gradient(60rem 28rem at 90% -12%,var(--acs),transparent)}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:var(--rs);min-height:2.75rem;padding:0 .9rem;transition:.15s}

/* Layout Shell */
.app-shell{display:flex;flex-direction:column;min-height:100%;height:100%;max-width:2400px;margin:0 auto}
.app-main{flex:1;display:flex;flex-direction:column;gap:.75rem;padding:.9rem;min-height:0;min-width:0;position:relative}

.brand b{font-size:1.15rem}.brand span{display:block;font-size:.8rem;color:var(--mu)}

.card h4{margin:0;font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}

/* Persistent Navigation (Desktop Side Nav / Mobile Bottom Nav) */
.side-nav{display:none}
.bottom-nav{display:none}

@media (min-width:1000px){

<script>
// Raw catalog definition: [name, size, category, bottlePrice, packSize, totsPerBottle, totPrice, initialBottles]
const RAW_CATALOG = [
  ["Tusker Lager","500ml","Beer",250,24,0,0,120],
  ["Guinness","500ml","Beer",300,24,0,0,80],
  ["Heineken","330ml","Beer",280,24,0,0,60],
  ["Johnnie Walker Black","750ml","Whisky",4800,6,25,350,8],
  ["Jameson","750ml","Whisky",3600,12,25,260,14],
  ["Jack Daniel’s","750ml","Whisky",4200,12,25,300,3],
  ["Black & White","750ml","Whisky",1500,12,25,110,18],
  ["Chrome Vodka","750ml","Vodka",1100,12,25,90,22],
  ["Smirnoff Red","750ml","Vodka",1500,12,25,120,16],
  ["Gilbey’s Gin","750ml","Gin",1600,12,25,130,11],
  ["Kenya Cane","750ml","Spirits",1100,12,25,90,30],
  ["Captain Morgan","750ml","Rum",1900,12,25,150,9],
  ["Hennessy VS","750ml","Cognac",7500,6,25,550,4],
  ["Amarula","750ml","Liqueur",2300,12,25,180,12],
  ["Four Cousins Sweet Red","750ml","Wine",1300,6,0,0,26],
  ["Nederburg Cabernet","750ml","Wine",1800,6,0,0,2],
  ["Robertson Chardonnay","750ml","Wine",1700,6,0,0,10]
];

// Helper: convert quantity in unit to base units (tot for spirits that sell tots, bottle otherwise)
function toBaseUnits(p, u, qty) {
  const factor = p.baseUnitsPerBottle || (p.tn > 0 ? p.tn : 1);
  if (p.baseUnit === "tot") {
    if (u === "t") return Math.round(qty);
    if (u === "b") return Math.round(qty * factor);
    if (u === "c") return Math.round(qty * p.k * factor);
  } else {
    if (u === "b") return Math.round(qty);
    if (u === "c") return Math.round(qty * p.k);
  }
  return Math.round(qty);
}

// Derived Stock Calculations (base units in ledger -> converted to bottles only for display)
function getProductBaseUnits(productId) {
  return state.stockMovements
    .filter(m => m.productId === productId)
    .reduce((sum, m) => sum + m.qty, 0);
}

function getProductStock(productId) {
  const p = state.products.find(x => x.id === productId);
  if (!p) return 0;
  const baseUnits = getProductBaseUnits(productId);
  return p.baseUnitsPerBottle > 1 ? baseUnits / p.baseUnitsPerBottle : baseUnits;
}

// Append a stock movement to the ledger, blocking any operation that causes negative stock
function recordStockMovement(m) {
  m.qty = Math.round(m.qty);
  const currentBase = getProductBaseUnits(m.productId);
  if (m.qty < 0 && (currentBase + m.qty) < 0) {
    return false; // Block negative stock
  }
  state.stockMovements.push(m);
  return true;
}

function add(id) {
  const p = state.products.find(x => x.id === id);
  if (!p || getProductBaseUnits(id) <= 0) {
    toast("Item is out of stock");
    return false;
  }
  const currentInCartBase = state.cart
    .filter(x => x.id === id)
    .reduce((sum, x) => sum + toBaseUnits(p, x.u, x.q), 0);
  const addBase = toBaseUnits(p, "b", 1);
  if (currentInCartBase + addBase > getProductBaseUnits(id)) {
    toast("Cannot add: exceeds available stock");
    return false;
  }
  const l = state.cart.find(x => x.id == id && x.u == "b");
  l ? l.q++ : state.cart.push({ id, u: "b", q: 1 });
  render();
  return true;
}

function qty(i, d) {
  const l = state.cart[i];
  if (!l) return false;
  const p = state.products.find(x => x.id === l.id);
  if (d > 0) {
    const currentInCartBase = state.cart
      .filter(x => x.id === l.id)
      .reduce((sum, x) => sum + toBaseUnits(p, x.u, x.q), 0);
    const addBase = toBaseUnits(p, l.u, d);
    if (currentInCartBase + addBase > getProductBaseUnits(l.id)) {
      toast("Cannot add: exceeds available stock");
      return false;
    }
  }
  l.q += d;
  if (l.q < 1) state.cart.splice(i, 1);
  render();
  return true;
}

function unit(i, u) {
  const l = state.cart[i];
  if (!l) return false;
  const p = state.products.find(x => x.id === l.id);
  const otherLinesBase = state.cart
    .filter((x, idx) => idx !== i && x.id === l.id)
    .reduce((sum, x) => sum + toBaseUnits(p, x.u, x.q), 0);
  const newBase = toBaseUnits(p, u, l.q);
  if (otherLinesBase + newBase > getProductBaseUnits(l.id)) {
    toast("Cannot switch unit: exceeds available stock");
    return false;
  }
  l.u = u;
  const j = state.cart.findIndex((x, k) => k != i && x.id == l.id && x.u == u);
  if (j > -1) {
    state.cart[j].q += l.q;
    state.cart.splice(i, 1);
  }
  render();
  return true;
}

function keep(id) {
  if (!id) return;
  const e = $(id);
  if (e) {
    e.focus();
    e.setSelectionRange(e.value.length, e.value.length);
  }
}

function scan(e) {
  if (e.key != "Enter") return;
  const f = list();
  if (f.length) {
    add(f[0].id);
    state.searchQuery = "";
    render();
    keep("q");
  }
}

function upd(k, v, id) {

function finish() {
  const t = total();
  const d = state.payment;

  // Validate all lines to ensure negative stock is blocked
  for (const l of state.cart) {
    const p = state.products.find(x => x.id === l.id);
    const currentCartBase = state.cart
      .filter(x => x.id === l.id)
      .reduce((sum, x) => sum + toBaseUnits(p, x.u, x.q), 0);
    if (currentCartBase > getProductBaseUnits(p.id)) {
      toast("Sale blocked: exceeds available stock for " + p.n);
      return false;
    }
  }

  const s = {
    no: "INV-" + String(++state.invoiceSeq).padStart(6, "0"),
    lines: state.cart.map(l => {
      const p = state.products.find(x => x.id === l.id);
      return { n: p.n, s: p.s, u: l.u, q: l.q, pr: price(p, l.u) };
    }),
    t,
    m: d.m,
    ref: d.ref,
    tend: d.tend,
    pend: d.m == "mpesa" && state.offline,
    at: new Date()
  };

  // Append-only stock movements ledger derivation (recording movements safely)
  for (const l of state.cart) {
    const p = state.products.find(x => x.id === l.id);
    const baseDelta = toBaseUnits(p, l.u, l.q);
    const ok = recordStockMovement({
      id: "mov_" + (++state.movementSeq),
      productId: p.id,
      type: "sale",
      qty: -baseDelta,
      unit: l.u,
      unitQty: l.q,
      ref: s.no,
      note: `Sale ${s.no} (${l.q} ${U[l.u]})`,
      user: state.till.cashier,
      at: new Date()
    });
    if (!ok) {
      toast("Stock movement blocked: would result in negative stock");
      return false;
    }
  }

  if (state.offline) state.syncCount++;
  state.sales.push(s);
  state.receipt = s;
  state.payment = null;
  state.cart = [];
  state.ageVerified = false;
  render();
  return true;
}

  state.adjustmentDraft.productId = productId;

function addReceiveLine() {
  state.receiveDraft.lines.push({ productId: 0, unit: "c", qty: 1, cost: 4800 });
  render();

function removeReceiveLine(idx) {
  if (state.receiveDraft.lines.length > 1) {
    state.receiveDraft.lines.splice(idx, 1);
  }
  render();
}

function updateReceiveLine(idx, field, val) {
  const line = state.receiveDraft.lines[idx];
  if (!line) return;
  line[field] = val;
  if (field === "productId") {
    const p = state.products.find(x => x.id === val);
    if (p) line.cost = line.unit === "c" ? p.cp : p.b;
  }
  if (field === "unit") {
    const p = state.products.find(x => x.id === line.productId);
    if (p) line.cost = val === "c" ? p.cp : p.b;
  }
  render();
}

function updateReceiveDraft(field, val) {
  state.receiveDraft[field] = val;
  render();
  keep("rec-ref");
}

function submitReceiveGoods() {
  if (!state.receiveDraft.lines.length) {
    toast("No products in receipt");
    return false;
  }
  const ref = state.receiveDraft.invoiceRef.trim() || ("REC-" + Math.random().toString(36).slice(2, 8).toUpperCase());
  const supplier = state.receiveDraft.supplier || "Distributor";

  for (const l of state.receiveDraft.lines) {
    if (l.qty <= 0) continue;
    const p = state.products.find(x => x.id === l.productId);
    const baseDelta = toBaseUnits(p, l.unit, l.qty);
    recordStockMovement({
      id: "mov_" + (++state.movementSeq),
      productId: p.id,
      type: "receipt",
      qty: baseDelta,
      unit: l.unit,
      unitQty: l.qty,
      buyingPrice: l.cost,
      supplier,
      ref,
      note: `Received ${l.qty} ${U[l.unit]} from ${supplier}`,
      user: "Owner",
      at: new Date()
    });
  }

  toast(`Received ${state.receiveDraft.lines.length} line(s) from ${supplier}`);
  state.receiveDraft = {
    supplier: state.suppliers[0],
    invoiceRef: "",
    lines: [{ productId: 0, unit: "c", qty: 2, cost: 4800 }]
  };
  state.stockTab = "overview";
  render();
  return true;
}

function updateStockTakeCount(productId, count) {
  state.stockTakeDraft.counts[productId] = count === "" ? "" : Math.max(0, +count);
  render();
  keep("stk-cnt-" + productId);
}

function autoFillStockTake() {
  state.products.forEach(p => {
    state.stockTakeDraft.counts[p.id] = p.st;
  });
  render();
}

function clearStockTake() {
  state.stockTakeDraft.counts = {};
  render();
}

function setStockTakeMode(mode) {
  state.stockTakeDraft.mode = mode;
  render();
}

function submitStockTake() {
  const countEntries = Object.entries(state.stockTakeDraft.counts).filter(([id, cnt]) => cnt !== "");
  if (!countEntries.length) {
    toast("Enter at least one product count");
    return false;
  }

  let adjustedCount = 0;
  const ref = "STK-TAKE-" + new Date().toLocaleDateString("en-KE").replace(/\//g, "");

  countEntries.forEach(([idStr, counted]) => {
    const id = +idStr;
    const p = state.products.find(x => x.id === id);
    if (!p) return;
    const diff = (+counted) - p.st;
    if (Math.abs(diff) > 0.001) {
      const baseDelta = p.baseUnitsPerBottle > 1 ? Math.round(diff * p.baseUnitsPerBottle) : Math.round(diff);
      recordStockMovement({
        id: "mov_" + (++state.movementSeq),
        productId: p.id,
        type: "take",
        qty: baseDelta,
        unit: "b",
        unitQty: Math.abs(diff),
        ref,
        note: `Stock take adjustment (${diff > 0 ? "+" : ""}${diff} btl)`,
        user: "Owner",
        at: new Date()
      });
      adjustedCount++;
    }
  });

  toast(`Stock take posted · ${adjustedCount} adjustment(s) applied`);
  state.stockTakeDraft.counts = {};
  state.stockTakeDraft.mode = "blind";
  state.stockTab = "overview";
  render();
  return true;
}

function updateAdjustmentDraft(field, val) {
  state.adjustmentDraft[field] = val;
  render();
  keep("adj-note");
}

function submitAdjustment() {
  const d = state.adjustmentDraft;
  const p = state.products.find(x => x.id === d.productId);
  if (!p) {
    toast("Select a product");
    return false;
  }
  if (!d.reason) {
    toast("Reason is mandatory for adjustments");
    return false;
  }
  if (d.qty <= 0) {
    toast("Quantity must be greater than 0");
    return false;
  }

  const isLoss = d.direction === "loss";
  const baseDelta = toBaseUnits(p, d.unit, d.qty) * (isLoss ? -1 : 1);

  if (baseDelta < 0 && (getProductBaseUnits(p.id) + baseDelta) < 0) {
    toast("Adjustment blocked: reduction exceeds available stock");
    return false;
  }

  const ok = recordStockMovement({
    id: "mov_" + (++state.movementSeq),
    productId: p.id,
    type: "adjustment",
    qty: baseDelta,
    unit: d.unit,
    unitQty: d.qty,
    reason: d.reason,
    note: d.note.trim() || `${d.reason.toUpperCase()} adjustment`,
    ref: "ADJ-" + d.reason.slice(0, 6).toUpperCase(),
    user: "Owner",
    at: new Date()
  });

  if (!ok) {
    toast("Adjustment blocked: negative stock");
    return false;
  }

  toast(`Adjustment posted: ${isLoss ? "−" : "+"}${d.qty} ${U[d.unit]} ${p.n} (${d.reason})`);
  state.adjustmentDraft.note = "";
  state.stockTab = "history";
  render();
  return true;
}

              <th>Product</th>
              <th>Category</th>
              <th style="text-align:right">${isBlind ? "Status" : "System stock"}</th>
              <th style="width:10rem;text-align:right">Physical count (btl)</th>
              <th style="text-align:right">Count variance</th>
              <th style="text-align:right">Financial impact</th>
            </tr>
          </thead>
          <tbody>
            ${state.products.map(p => {
              const entered = counts[p.id];
              const hasCount = entered !== undefined && entered !== "";
              const countNum = hasCount ? +entered : null;
              const diff = hasCount ? (countNum - p.st) : null;
              const costEst = Math.round(p.b * 0.8);
              const valDiff = diff !== null ? Math.round(diff * costEst) : null;

              return `
              <tr>
                <td><b>${p.n}</b> <small class="mu">${p.s}</small></td>
                <td>${p.g}</td>
                <td style="text-align:right">
                  ${isBlind ? `<span class="badge ${hasCount ? "b-rec" : "b-open"}">${hasCount ? "Counted" : "Pending"}</span>` : `<b>${fs(p.st)}</b> btl`}
                </td>
                <td style="text-align:right">
                  <input id="stk-cnt-${p.id}" type="number" min="0" step="1" placeholder="Enter btl…" value="${entered ?? ""}" oninput="updateStockTakeCount(${p.id}, this.value)" style="text-align:right;min-height:2.4rem">
                </td>
                <td style="text-align:right">
                  ${diff === null ? `<span class="mu">—</span>` :
                    diff === 0 ? `<span class="badge b-rec">Matched (0)</span>` :
                    diff < 0 ? `<span class="badge low">−${Math.abs(diff)} btl (Loss)</span>` :
                    `<span class="badge b-rec">+${diff} btl (Gain)</span>`}
                </td>
                <td style="text-align:right">
                  ${valDiff === null ? `<span class="mu">—</span>` :
                    valDiff === 0 ? `<span class="mu">KES 0</span>` :
                    valDiff < 0 ? `<b class="low">− ${kes(Math.abs(valDiff))}</b>` :
                    `<b class="ok">+ ${kes(valDiff)}</b>`}
                </td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>

    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem">
      <div style="display:flex;gap:1.5rem;align-items:center">
        <div><small class="mu">Products counted:</small> <b>${countEntries.length} / ${state.products.length}</b></div>
        <div><small class="mu">Discrepancies:</small> <b class="${discrepancyCount ? "low" : ""}">${discrepancyCount}</b></div>
        <div><small class="mu">Net variance:</small> <b class="${netVarianceValue < 0 ? "low" : "ok"}">${netVarianceValue < 0 ? "− " + kes(Math.abs(netVarianceValue)) : "+ " + kes(netVarianceValue)}</b></div>
      </div>
      <div style="display:flex;gap:.6rem">
        <button class="ghost" onclick="setStockTab('overview')">Cancel</button>
        <button class="pri" style="min-width:14rem" ${!countEntries.length ? "disabled" : ""} onclick="submitStockTake()">Approve &amp; Post Variances</button>
      </div>
    </div>
  </div>`;
}

// Payment & Receipt Modals
function pay() {
  const d = state.payment;
  const t = total();
  let b, ok;
  if (d.m == "cash") {
    ok = d.tend >= t;
    const q = [t, ...[500, 1000, 2000, 5000].filter(x => x > t)].slice(0, 4);
    b = `<div><label class="fl" for="tend">Amount received</label><div class="inp"><span>KES</span><input id="tend" inputmode="numeric" value="${d.tend}" oninput="upd('tend',+this.value.replace(/\\D/g,''),'tend')"></div></div><div class="qk">${q.map(x=>`<button class="${x==d.tend?"on":""}" onclick="upd('tend',${x})">${x==t?"Exact":x.toLocaleString()}</button>`).join("")}</div><div class="sum ${ok?"good":"bad"}"><span>${ok?"Change due":"Still to pay"}</span><b>${kes(Math.abs(d.tend-t))}</b></div>`;
  } else if (state.offline) {
    ok = d.ref.length >= 8;
    b = `<div class="bn">Offline · enter the confirmation code from the customer’s M-Pesa SMS. It will be flagged for reconciliation.</div><div><label class="fl" for="ref">M-Pesa code</label><div class="inp"><input id="ref" placeholder="SJK4X9P2QA" value="${d.ref}" oninput="upd('ref',this.value.toUpperCase(),'ref')"></div></div>`;
  } else {
    ok = d.st == "ok";
    b = `<div><label class="fl" for="phone">Customer phone</label><div class="inp"><input id="phone" inputmode="tel" value="${d.phone}" oninput="upd('phone',this.value,'phone')"></div></div>` + (ok ? `<div class="sum good"><span>Payment received</span><b>${d.ref}</b></div>` : `<button class="stk" ${d.st=="idle"?"":"disabled"} onclick="stk()">${d.st=="wait"?"Waiting for customer PIN…":"Send STK push"}</button>`);
  }
  return `<div class="ov"><div class="mod"><div class="mh"><div><small>Amount due</small><h3>${kes(t)}</h3></div><button class="x" aria-label="Close" onclick="state.payment=null;render()">✕</button></div><div class="mt"><button class="${d.m=="cash"?"on":""}" onclick="upd('m','cash')">${IC.cash} Cash</button><button class="${d.m=="mpesa"?"on":""}" onclick="upd('m','mpesa')">${IC.phone} M-Pesa</button></div><div class="mb">${b}</div><div class="ft"><button class="ghost" onclick="state.payment=null;render()">Cancel</button><button class="pri" style="flex:2" ${ok?"":"disabled"} onclick="finish()">Complete sale</button></div></div></div>`;
}

function rcpt() {
  const s = state.receipt;
  const st = s.m == "cash" ? "Cash received" : s.pend ? "M-Pesa · pending reconciliation" : "M-Pesa confirmed";
  return `<div class="ov"><div class="rw"><div class="rok">${IC.ok}<div><b>Sale complete</b><small>${st}</small></div></div><div class="paper"><div class="c"><b style="font-size:1rem">CELLAR &amp; CO.</b><br>WINES &amp; SPIRITS<br><span class="m">Demo shop · Nairobi · PIN P000000000X</span></div><hr><div class="r"><span>${s.no}</span><span>${s.at.toLocaleString("en-KE",{dateStyle:"short",timeStyle:"short"})}</span></div><div class="r m"><span>Cashier 1</span><span>Till 1</span></div><hr>${s.lines.map(l=>`<div><div class="r"><span>${l.n}</span><b>${(l.q*l.pr).toLocaleString()}</b></div><div class="m">${l.q} × ${l.pr.toLocaleString()} · ${l.s} · ${U[l.u]}</div></div>`).join("")}<hr><div class="r m"><span>Subtotal (excl. VAT)</span><span>${Math.round(s.t*100/116).toLocaleString()}</span></div><div class="r m"><span>VAT 16%</span><span>${Math.round(s.t*16/116).toLocaleString()}</span></div><div class="r tt"><span>TOTAL</span><span>${kes(s.t)}</span></div><div class="r m"><span>${s.m=="cash"?"Cash":"M-Pesa "+s.ref}</span><span>${s.m=="cash"?"Change "+(s.tend-s.t).toLocaleString():s.pend?"Pending":"Paid"}</span></div><hr><div class="qr">eTIMS QR</div><div class="c m">Thank you · Drink responsibly · 18+</div></div><div class="ft"><button onclick="toast('Sent to printer · drawer opened (demo)')">Print receipt</button><button class="pri" onclick="state.receipt=null;render()">New sale</button></div></div></div>`;
}

// Master Render Function
function render() {
  if (!state.cart.length) state.cartOpen = false;
  const curScreen = SCREENS[state.view] || SCREENS.sell;
  const screensList = Object.values(SCREENS);

  $("app").innerHTML = `
<div class="app-shell">
  <!-- Desktop Persistent Side Navigation -->
  <aside class="side-nav" aria-label="Main Navigation">
    <div class="side-brand">
      <div class="brand">
        <b>Cellar POS</b>
        <span>Wines &amp; Spirits</span>
      </div>
    </div>
    <nav>
      ${screensList.map(s => `
        <button class="nav-btn ${state.view === s.id ? "on" : ""}" onclick="go('${s.id}')">
          ${NAV_ICONS[s.id] || ""}
          <span>${s.label}</span>
        </button>
      `).join("")}
    </nav>
    <div class="side-foot">
      <div class="side-user">
        <b>${state.till.cashier}</b>
        <small>Till ${state.till.tillNumber} · Float ${kes(state.till.float)}</small>
      </div>
    </div>
  </aside>

  <!-- Main View Area -->
  <div class="app-main">
    <header class="top">
      <div class="brand mobile-brand">
        <b>Cellar POS</b>
        <span>Prototype · demo data</span>
      </div>
      <div class="desktop-title">
        <b>${curScreen.title}</b>
        <span>${curScreen.subtitle}</span>
      </div>
      <div class="rt">
        <button class="pill ${state.offline ? "wn" : "ok"}" onclick="tOff()">● ${state.offline ? "Offline" : "Online"}</button>
        <button class="pill" onclick="tTheme()">Light / Dark</button>
      </div>
    </header>

    ${state.offline ? `<div class="bn">Offline mode · sales are saved on this device · ${state.syncCount} waiting to sync</div>` : ""}

    <main>
      ${renderScreen(state.view)}
    </main>
  </div>

  <!-- Mobile Persistent Bottom Navigation -->
  <nav class="bottom-nav" aria-label="Mobile Navigation">
    ${screensList.map(s => `
      <button class="b-nav-btn ${state.view === s.id ? "on" : ""}" onclick="go('${s.id}')">
        ${NAV_ICONS[s.id] || ""}
        <span>${s.label}</span>
      </button>
    `).join("")}
  </nav>
</div>
${state.payment ? pay() : ""}
${state.receipt ? rcpt() : ""}`;
}

render();
</script></body></html>
